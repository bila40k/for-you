<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0f2e">
<title>Телефон фаната</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;500;700;800&family=Caveat:wght@600;700&display=swap">
<style>
  /* Сезон 4: квест-розслідування. Їй потрапив до рук телефон таємного фаната.
     Замок (емодзі-математика, PIN 4724) → домашній екран → 4 застосунки, кожен дає слово:
     Музика → ТИ · Галерея → НАЙФАЙНІША · Нотатки → СВІТІ · Карти → НА
     Повідомлення відкриваються реченням «ТИ НАЙФАЙНІША НА СВІТІ» → чернетки фаната → фінал.
     Тексти — в <script>. Прогрес зберігається в браузері. */
  :root {
    --ink: #1a0f2e;
    --ink2: #2a1b45;
    --glass: rgba(255,255,255,.12);
    --glass2: rgba(255,255,255,.2);
    --paper: #fff7ee;
    --text: #fbf8ff;
    --muted: rgba(251,248,255,.66);
    --pink: #ff4f9a;
    --violet: #7a5cff;
    --lime: #c8ff2e;
    --red: #ff5a5a;
    --ui: "Onest", "Segoe UI", system-ui, sans-serif;
    --hand: "Caveat", "Segoe Print", cursive;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink); color: var(--text); font-family: var(--ui);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

  .phone {
    position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden;
    background:
      radial-gradient(70% 50% at 20% 10%, rgba(255,79,154,.55), transparent 70%),
      radial-gradient(70% 50% at 90% 60%, rgba(122,92,255,.55), transparent 70%),
      radial-gradient(60% 40% at 30% 100%, rgba(200,255,46,.18), transparent 70%),
      var(--ink);
  }
  .status {
    position: absolute; left: 0; right: 0; top: 0; z-index: 30;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 22px 12px;
    background: linear-gradient(rgba(26,15,46,.92) 55%, rgba(26,15,46,0));
    display: flex; justify-content: space-between; font: 700 .85rem var(--ui); pointer-events: none;
  }
  .screen {
    position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: calc(40px + env(safe-area-inset-top, 0px)) 18px calc(24px + env(safe-area-inset-bottom, 0px));
    animation: open .35s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes open { from { opacity: 0; transform: scale(.94); } }
  .app { background: var(--ink); }

  /* Lock */
  .lock { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .lock .date { font: 500 1rem var(--ui); color: var(--muted); margin-top: 10px; }
  .lock .clock { font: 300 5.2rem/1 var(--ui); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .notif {
    width: 100%; text-align: left; background: var(--glass); border: 1px solid var(--glass2);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 20px; padding: 12px 14px; display: grid; gap: 3px;
    animation: open .5s ease both;
  }
  .notif small { font: 700 .72rem var(--ui); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .notif div { font: 500 1rem/1.35 var(--ui); }
  .notif .eq { font-size: 1.15rem; letter-spacing: .02em; }
  .dots { display: flex; gap: 14px; margin: 6px 0 2px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--text); }
  .dots i.on { background: var(--text); }
  .keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px 22px; justify-content: center; }
  .keypad button {
    width: 72px; height: 72px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass2);
    font: 500 1.7rem var(--ui); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .keypad button:active { background: var(--glass2); }
  .keypad .txt { background: none; border: 0; font-size: .95rem; font-weight: 700; }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

  /* Home */
  .widget {
    background: var(--glass); border: 1px solid var(--glass2); border-radius: 24px; padding: 14px 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: grid; gap: 10px; margin-top: 8px;
  }
  .widget small { font: 700 .72rem var(--ui); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; }
  .words span { padding: 7px 11px; border-radius: 10px; font: 800 .9rem var(--ui); background: rgba(0,0,0,.25); color: var(--muted); letter-spacing: .04em; }
  .words span.got { background: var(--lime); color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 8px; margin-top: 22px; }
  .icon { display: grid; justify-items: center; gap: 6px; font: 500 .74rem var(--ui); position: relative; }
  .icon .sq {
    width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; font-size: 1.8rem;
    background: var(--c); box-shadow: 0 6px 16px rgba(0,0,0,.3);
  }
  .icon:active .sq { transform: scale(.92); }
  .icon .badge { position: absolute; top: -6px; right: calc(50% - 38px); min-width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; font: 800 .75rem var(--ui); padding: 0 6px; }
  .icon .badge.ok { background: var(--lime); color: var(--ink); }
  .icon .badge.lock { background: #000; font-size: .7rem; }
  .icon .badge.new { background: var(--red); }
  .dock { margin-top: 28px; text-align: center; font: 500 .85rem var(--ui); color: var(--muted); }
  .toast {
    position: absolute; left: 18px; right: 18px; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    background: var(--paper); color: var(--ink); border-radius: 18px; padding: 13px 16px;
    font: 700 .95rem/1.35 var(--ui); box-shadow: 0 10px 30px rgba(0,0,0,.4);
    animation: open .3s ease both;
  }

  /* App chrome */
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .back { font: 700 1rem var(--ui); color: var(--pink); padding: 6px 0; }
  .help { width: 36px; height: 36px; border-radius: 50%; background: var(--ink2); font-size: 1rem; }
  .app h1 { margin: 0 0 4px; font: 800 2rem/1.05 var(--ui); letter-spacing: -.02em; }
  .app .sub { margin: 0 0 16px; color: var(--muted); font: 500 .98rem/1.4 var(--ui); }
  .hint {
    margin: 10px 0 0; padding: 11px 14px; border-radius: 14px;
    background: rgba(200,255,46,.12); border: 1px solid rgba(200,255,46,.35); color: var(--lime);
    font: 600 .95rem/1.35 var(--ui); animation: open .3s ease both;
  }
  .card { background: var(--ink2); border-radius: 20px; padding: 14px; }
  .q { margin: 18px 0 10px; font: 800 1.1rem/1.3 var(--ui); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opts button { padding: 14px; border-radius: 14px; background: var(--ink2); font: 800 1.05rem var(--ui); border: 1.5px solid transparent; }
  .opts button.no { border-color: var(--red); color: var(--red); }
  .opts button.yes { background: var(--lime); color: var(--ink); }
  .say { min-height: 1.4em; margin-top: 10px; font: 700 .98rem var(--ui); }
  .say.no { color: var(--red); } .say.ok { color: var(--lime); }
  .won {
    margin-top: 16px; padding: 16px; border-radius: 18px; text-align: center;
    background: var(--lime); color: var(--ink); display: grid; gap: 4px; animation: open .4s ease both;
  }
  .won small { font: 700 .75rem var(--ui); text-transform: uppercase; letter-spacing: .08em; }
  .won b { font: 800 1.7rem var(--ui); letter-spacing: .06em; }

  /* Music */
  .track { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .track .cov { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; font-size: 1.3rem; background: var(--c); }
  .track b { display: block; font: 700 1rem var(--ui); }
  .track span { font: 500 .85rem var(--ui); color: var(--muted); }
  .track em { font: 500 .85rem var(--ui); color: var(--muted); font-style: normal; font-variant-numeric: tabular-nums; }

  /* Gallery */
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ph {
    position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; max-width: 100%;
    background: var(--c); display: grid; place-items: center; font-size: 2rem;
    transition: transform .15s, opacity .3s;
  }
  .ph:active { transform: scale(.95); }
  .ph .tm { position: absolute; left: 6px; bottom: 5px; font: 800 .78rem var(--ui); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
  .ph .lt { position: absolute; right: 6px; top: 5px; width: 24px; height: 24px; border-radius: 7px; background: rgba(0,0,0,.45); display: grid; place-items: center; font: 800 .85rem var(--ui); color: #fff; }
  .ph.used { opacity: .3; }
  .ph.used::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; font: 800 2rem var(--ui); color: var(--lime); }
  .strip { display: flex; flex-wrap: wrap; gap: 4px; min-height: 40px; margin: 14px 0 0; }
  .strip i { width: 30px; height: 38px; border-radius: 8px; background: var(--ink2); display: grid; place-items: center; font: 800 1.1rem var(--ui); font-style: normal; color: var(--lime); }

  /* Notes */
  .note {
    background: var(--paper); color: #2b2135; border-radius: 18px; padding: 18px 18px 20px;
    font: 600 1.45rem/1.35 var(--hand);
    background-image: repeating-linear-gradient(transparent 0 calc(1.35 * 1.45rem - 1px), rgba(122,92,255,.18) calc(1.35 * 1.45rem - 1px) calc(1.35 * 1.45rem));
    background-position: 0 18px;
  }
  .note h3 { margin: 0 0 6px; font: 700 1.7rem var(--hand); color: var(--violet); }
  .note p { margin: 0; }
  .list { display: grid; gap: 8px; margin-bottom: 14px; }
  .list button { text-align: left; background: var(--ink2); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; }
  .list b { font: 700 1rem var(--ui); } .list span { font: 500 .85rem var(--ui); color: var(--muted); }
  .slots { display: flex; gap: 6px; justify-content: center; margin: 16px 0 10px; }
  .slots i { width: 42px; height: 50px; border-radius: 12px; border: 2px dashed rgba(255,255,255,.3); display: grid; place-items: center; font: 800 1.4rem var(--ui); font-style: normal; }
  .slots i.f { border: 2px solid var(--lime); color: var(--lime); }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tiles button { width: 46px; height: 50px; border-radius: 12px; background: var(--ink2); font: 800 1.3rem var(--ui); }
  .tiles button:disabled { opacity: .25; }
  .tiles .del { width: auto; padding: 0 14px; font-size: 1rem; }

  /* Maps */
  .map { width: 100%; height: auto; max-width: 100%; border-radius: 20px; background: #16324a; display: block; }
  .map .pin { cursor: pointer; }
  .map .pin circle.dot { fill: var(--pink); stroke: #fff; stroke-width: 2; }
  .map .pin.ok circle.dot { fill: var(--lime); }
  .map .pin.bad circle.dot { fill: var(--red); }
  .map .pin text { fill: #fff; font: 700 10px var(--ui); paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 3px; }
  .map .pin .tag { fill: var(--ink); stroke: none; font: 800 11px var(--ui); }
  .route { display: grid; gap: 8px; margin-top: 12px; }
  .stop { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; background: var(--ink2); border-radius: 14px; padding: 11px 12px; font: 600 .95rem/1.35 var(--ui); }
  .stop b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); font: 800 .85rem var(--ui); }
  .stop.done b { background: var(--lime); color: var(--ink); }
  .stop.now { outline: 1.5px solid var(--pink); }

  /* Messages */
  .chat { display: flex; flex-direction: column; gap: 8px; }
  .draft { align-self: flex-end; max-width: 84%; background: var(--violet); border-radius: 20px 20px 6px 20px; padding: 10px 14px; font: 500 1rem/1.4 var(--ui); animation: open .35s ease both; }
  .draft small { display: block; font: 700 .7rem var(--ui); opacity: .7; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .05em; }
  .draft.del { opacity: .55; text-decoration: line-through; text-decoration-color: rgba(255,255,255,.5); }
  .compose { display: flex; gap: 8px; align-items: flex-end; margin-top: 14px; }
  .compose div { flex: 1; background: var(--ink2); border-radius: 20px; padding: 10px 14px; font: 500 1rem/1.4 var(--ui); }
  .send { width: 46px; height: 46px; border-radius: 50%; background: var(--pink); font-size: 1.2rem; flex: none; }
  .sent { align-self: flex-end; font: 600 .8rem var(--ui); color: var(--muted); }
  .final { margin-top: 18px; padding: 20px; border-radius: 22px; background: var(--paper); color: var(--ink); display: grid; gap: 10px; animation: open .5s ease both; }
  .final h2 { margin: 0; font: 800 1.6rem/1.1 var(--ui); }
  .final p { margin: 0; font: 500 1rem/1.45 var(--ui); }
  .final .sign { font: 700 1.5rem var(--hand); color: var(--violet); }
  .again { margin-top: 14px; width: 100%; padding: 13px; border-radius: 14px; background: var(--ink2); font: 700 .95rem var(--ui); }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
  @media (prefers-reduced-motion: reduce) { .screen, .notif, .toast, .draft, .final, .won, .hint { animation: none; } }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status"><span id="sbt">9:41</span><span>📶 🔋 100%</span></div>
  <div id="root"></div>
</div>
<canvas id="fx"></canvas>

<script>
(() => {
  // ================== ТЕКСТИ ==================
  const SIGNATURE = 'той, хто на твоїй стороні 🖤';
  const DRAFTS = [
    'привіт. ти сьогодні барз файна. ніт, видалю. кринж',
    'а може просто написати «ти неймовірна»? ніт, мало',
    'придумав для тя квест. потім ще один. і ще. ци то нормально? 🙈',
    'твоя краса — то не про фото. то про те, як ти смієшся, як дивишся, як ти є. і я того не вмію сказати коротко, тому вже четвертий сезон',
  ];
  const LAST = 'хочу, жеб ти знала: ти найфайніша на світі. не в квесті. насправді. 🖤';
  // ============================================

  const root = document.getElementById('root');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY = 'telefon-fanata-v1';
  let st = { unlocked: false, words: {}, done: false };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') st = Object.assign(st, s); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

  // порядок у віджеті навмисно не той, што в реченні
  const ORDER = [['gallery', 'НАЙФАЙНІША'], ['notes', 'СВІТІ'], ['music', 'ТИ'], ['maps', 'НА']];

  function tickClock() {
    const d = new Date();
    const t = d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('sbt').textContent = t;
    const c = document.getElementById('clk'); if (c) c.textContent = t;
  }
  setInterval(tickClock, 15000);

  function screen(html, cls = '') {
    root.innerHTML = `<section class="screen ${cls}">${html}</section>`;
    tickClock();
    return root.firstElementChild;
  }
  function toast(text) {
    document.querySelector('.toast')?.remove();
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
    document.getElementById('phone').appendChild(t);
    setTimeout(() => t.remove(), 2800);
  }
  function hints(s, list) {
    const btn = s.querySelector('.help'), box = s.querySelector('.hints');
    let n = 0;
    btn.onclick = () => {
      if (n >= list.length) { toast('підказки скінчилися. айбо ти й так можеш 💪'); return; }
      const h = document.createElement('div'); h.className = 'hint'; h.textContent = '💡 ' + list[n++];
      box.appendChild(h); h.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
    };
  }
  function appChrome(title, sub) {
    return `<div class="bar"><button class="back">‹ Додому</button><button class="help" aria-label="Підказка">💡</button></div>
      <h1>${title}</h1><p class="sub">${sub}</p>`;
  }
  function bindBack(s) { s.querySelector('.back').onclick = home; }
  function win(s, key, word, after) {
    st.words[key] = word; save();
    const w = document.createElement('div');
    w.className = 'won';
    w.innerHTML = `<small>слово знайдено</small><b>${word}</b><span>його вже записано на домашній екран</span>`;
    s.appendChild(w);
    const r = w.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + 20, ['✨', '💖', '⭐'], 16);
    w.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
    after?.();
  }

  // ---------- Lock screen ----------
  function lock() {
    const s = screen(`
      <div class="lock">
        <div class="date">${new Date().toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
        <div class="clock" id="clk"></div>
        <div class="notif"><small>🔐 Нотатки · щойно</small><div>PIN, жеб не забути: <b class="eq">🌸⭐👑🌸</b></div></div>
        <div class="notif" style="animation-delay:.15s"><small>⏰ Нагадування</small><div class="eq">🌸 + 🌸 = 8<br>🌸 + ⭐ = 11<br>⭐ − 👑 = 5</div></div>
        <div class="notif" style="animation-delay:.3s"><small>💬 Повідомлення · щойно</small><div>Ой. То мій телефон. Не відкривай!! …айбо кедь відкриєш — то для тебе 🙈</div></div>
        <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
        <div class="keypad" id="kp"></div>
        <div class="hints" style="width:100%"></div>
      </div>`);
    const kp = s.querySelector('#kp'), dots = s.querySelector('#dots');
    let pin = '', miss = 0;
    const lockHints = ['🌸 + 🌸 = 8, отже одна 🌸 — то половина від 8', '🌸 = 4, ⭐ = 7, 👑 = 2. Тепер підстав у 🌸⭐👑🌸', 'PIN: 4724'];
    let hn = 0;
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '💡', '0', '⌫'];
    keys.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      if (k === '💡' || k === '⌫') b.className = 'txt';
      b.setAttribute('aria-label', k === '💡' ? 'Підказка' : k === '⌫' ? 'Стерти' : k);
      b.onclick = () => {
        if (k === '💡') {
          const box = s.querySelector('.hints');
          if (hn >= lockHints.length) return;
          const h = document.createElement('div'); h.className = 'hint'; h.textContent = '💡 ' + lockHints[hn++]; box.appendChild(h);
          h.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
          return;
        }
        if (k === '⌫') pin = pin.slice(0, -1);
        else if (pin.length < 4) pin += k;
        [...dots.children].forEach((d, i) => d.classList.toggle('on', i < pin.length));
        if (pin.length === 4) {
          if (pin === '4724') {
            st.unlocked = true; save();
            navigator.vibrate?.(30);
            setTimeout(home, 250);
          } else {
            miss++;
            dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
            navigator.vibrate?.(80);
            toast(miss < 2 ? 'Неправильний PIN. Порахуй ще раз 🌸' : 'Ніт. Тицни 💡 зліва від нуля, кедь треба');
            setTimeout(() => { pin = ''; [...dots.children].forEach(d => d.classList.remove('on')); }, 350);
          }
        }
      };
      kp.appendChild(b);
    });
  }

  // ---------- Home ----------
  function home() {
    const n = ORDER.filter(([k]) => st.words[k]).length;
    const all = n === 4;
    const s = screen(`
      <div class="widget">
        <small>🔒 пароль до «Повідомлень» · ${n}/4</small>
        <div class="words">${ORDER.map(([k, w]) => `<span class="${st.words[k] ? 'got' : ''}">${st.words[k] ? w : '·'.repeat(Math.min(w.length, 6))}</span>`).join('')}</div>

        <path d="M150 70 l18 -26 l18 26 Z M210 90 l22 -34 l22 34 Z M240 120 l16 -22 l16 22 Z" fill="#2d6a4f" opacity=".7"/>
        ${Object.entries(PINS).map(([n, [x, y]]) => `<g class="pin" data-n="${n}" tabindex="0" role="button" aria-label="${n}"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle class="dot" cx="${x}" cy="${y}" r="7"/><text x="${x}" y="${y + 20}" text-anchor="middle">${n}</text></g>`).join('')}

    const route = s.querySelectorAll('.stop'), strip = s.querySelector('#strip'), say = s.querySelector('.say');
    let k = 0;
    const mark = () => route.forEach((r, i) => { r.classList.toggle('done', i < k); r.classList.toggle('now', i === k); });
    if (st.words.maps) { k = 3; mark(); STOPS.forEach(([n]) => s.querySelector(`.pin[data-n="${n}"]`).classList.add('ok')); strip.innerHTML = '<i>Н</i><i>А</i>'; say.className = 'say ok'; say.textContent = 'вже розгадано ✓'; return; }
    mark();
    const pick = g => {
      if (k >= STOPS.length) return;
      const n = g.dataset.n;
      if (n === STOPS[k][0]) {
        g.classList.add('ok');
        if (k > 0) {
          const [x, y, l] = PINS[n];
          g.insertAdjacentHTML('beforeend', `<circle cx="${x + 14}" cy="${y - 14}" r="9" fill="#c8ff2e"/><text class="tag" x="${x + 14}" y="${y - 10}" text-anchor="middle">${l}</text>`);

        }

        g.classList.add('bad'); setTimeout(() => g.classList.remove('bad'), 500);
        say.className = 'say no'; say.textContent = `${n}? Файне місто, айбо не та точка`;
        navigator.vibrate?.(50);
      }
    };
    s.querySelectorAll('.pin').forEach(g => { g.onclick = () => pick(g); g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(g); } }; });

  async function openChat(s, instant) {
    s.querySelector('#gate').hidden = true;
    const chat = s.querySelector('#chat'); chat.hidden = false;
    const wait = ms => new Promise(r => setTimeout(r, instant || reduced ? 0 : ms));
    chat.innerHTML = '<div style="text-align:center;font:700 .75rem var(--ui);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">чернетки · не надіслано</div>';
    for (let i = 0; i < DRAFTS.length; i++) {
      await wait(i ? 1500 : 400);
      const d = document.createElement('div');
      d.className = 'draft' + (i < 2 ? ' del' : '');
      d.innerHTML = `<small>чернетка ${i + 1}${i < 2 ? ' · видалено' : ''}</small>${DRAFTS[i]}`;
      chat.appendChild(d);
      d.scrollIntoView({ behavior: instant || reduced ? 'auto' : 'smooth', block: 'end' });
    }
    await wait(1400);
    const c = document.createElement('div'); c.className = 'compose';
    c.innerHTML = `<div>${LAST}</div><button class="send" aria-label="Надіслати">➤</button>`;
    chat.appendChild(c);
    c.scrollIntoView({ behavior: instant || reduced ? 'auto' : 'smooth', block: 'end' });
    if (st.done) { sendIt(true); return; }
    toast('Він так і не наважився надіслати. Натисни ➤ за нього 🙈');
    c.querySelector('.send').onclick = () => sendIt(false);
    function sendIt(quiet) {
      c.remove();
      const d = document.createElement('div'); d.className = 'draft'; d.style.background = 'var(--pink)';
      d.innerHTML = LAST; chat.appendChild(d);
      const ok = document.createElement('div'); ok.className = 'sent'; ok.textContent = 'доставлено ✓✓'; chat.appendChild(ok);
      if (!quiet) {
        st.done = true; save();
        let t = 0;
        const fire = setInterval(() => { burst(Math.random() * innerWidth, innerHeight - 30, ['💖', '✨', '🖤', '⭐'], 5, true); if (++t > (reduced ? 2 : 14)) clearInterval(fire); }, 140);
      }
      const f = document.createElement('div'); f.className = 'final';
      f.innerHTML = `<h2>Сезон 4 пройдено 🔓</h2>
        <p>Ти розблокувала чужий телефон, розгадала плейлист, галерею, карту й вірш — і знайшла те, што він так і не наважився сказати.</p>
        <p>А хто він — ти знаєш. Питай особисто 😉</p>
        <div class="sign">— ${SIGNATURE}</div>`;
      chat.appendChild(f);
      const a = document.createElement('button'); a.className = 'again'; a.textContent = 'заблокувати й пройти ще раз';
      a.onclick = () => { st = { unlocked: false, words: {}, done: false }; save(); lock(); };
      chat.appendChild(a);
      setTimeout(() => f.scrollIntoView({ behavior: quiet || reduced ? 'auto' : 'smooth', block: 'start' }), 300);
    }
  }

  // ---------- FX ----------
  const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
  let DPR;
  const sprites = new Map(), bits = [];
  function sprite(ch) {
    let s = sprites.get(ch);
    if (s) return s;
    s = document.createElement('canvas'); s.width = s.height = 64 * DPR;
    const g = s.getContext('2d');
    g.font = `${51 * DPR}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, s.width / 2, s.height / 2 + 3 * DPR);
    sprites.set(ch, s); return s;
  }
  function burst(x, y, set, n = 8, up = false) {
    if (reduced) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) {
      if (bits.length > 200) bits.shift();
      const ch = set[(Math.random() * set.length) | 0], a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      bits.push({ ch, img: sprite(ch), x, y, vx: up ? (Math.random() - .5) * 4 : Math.cos(a) * sp, vy: up ? -(5 + Math.random() * 7) : Math.sin(a) * sp - 3,
        g: up ? .12 : .28, rot: (Math.random() - .5) * .6, vr: (Math.random() - .5) * .15, size: 18 + Math.random() * 18, life: 80 });
    }
  }
  let dirty = false;
  function loop() {
    if (bits.length || dirty) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, fx.width, fx.height); dirty = bits.length > 0; }
    let alive = 0;
    for (const b of bits) {
      if (--b.life <= 0) continue;
      bits[alive++] = b;
      b.vy += b.g; b.vx *= .98; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      const c = Math.cos(b.rot) * DPR, sn = Math.sin(b.rot) * DPR, r = b.size / 2;
      ctx.setTransform(c, sn, -sn, c, b.x * DPR, b.y * DPR);
      ctx.globalAlpha = b.life < 25 ? b.life / 25 : 1;
      ctx.drawImage(b.img, -r, -r, b.size, b.size);
    }
    bits.length = alive; ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  function resize() { DPR = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * DPR; fx.height = innerHeight * DPR; sprites.clear(); for (const b of bits) b.img = sprite(b.ch); }
  resize(); addEventListener('resize', resize); requestAnimationFrame(loop);

  st.unlocked ? home() : lock();
})();
</script>
</body>
</html>
