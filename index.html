<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нічна скринька</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&family=Caveat:wght@600;700&display=swap">
<style>
  /* Квест: 4 замки → 4 цифри → кодовий замок на скриньці.
     1) Ліхтарик: порахувати чорних котів у темряві  → 7
     2) Шифр: покрутити колесо на ключ 7              → 2
     3) Сузір'я: з'єднати зорі, вийде цифра           → 3
     4) Коти-детективи: хто з'їв ковбасу (Пушок, №6)  → 6
     Код скриньки: 7236. Текст листа — в FINAL_LETTER нижче. */
  :root {
    --night: #120e1c;
    --night-hi: #2a2142;
    --paper: #fff8ef;
    --ink: #221a2e;
    --pink: #ff6fa5;
    --violet: #7b61ff;
    --teal: #2ec4b6;
    --gold: #ffc85a;
    --red: #ff5a52;
    --muted: #a99fc0;
    --panel: rgba(255, 248, 239, .06);
    --line: rgba(255, 248, 239, .14);
    --font-display: "Rubik", "Segoe UI", system-ui, sans-serif;
    --font-hand: "Caveat", "Segoe Print", cursive;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 25%, var(--night-hi) 0%, var(--night) 70%) fixed;
    background-color: var(--night);
    color: var(--paper);
    font-family: var(--font-display);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overflow-x: hidden;
  }
  #sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #sky { z-index: 0; }
  #fx { z-index: 50; }

  .wrap {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; gap: 16px;
  }

  /* Top: 4 lock slots */
  .locks { display: flex; justify-content: center; gap: 10px; }
  .lock {
    width: 46px; height: 54px; border-radius: 12px;
    border: 2px dashed var(--line);
    display: grid; place-items: center;
    font: 800 1.4rem var(--font-display);
    color: var(--muted);
    transition: all .4s cubic-bezier(.3,1.6,.5,1);
  }
  .lock.got {
    border: 2px solid var(--gold); color: var(--ink);
    background: var(--gold); box-shadow: 0 0 18px rgba(255,200,90,.5);
    transform: scale(1.05);
  }
  .lock.now { border-color: var(--pink); border-style: solid; }

  .scene { display: flex; flex-direction: column; gap: 14px; animation: rise .5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .tag { font: 800 .7rem var(--font-display); letter-spacing: .16em; text-transform: uppercase; color: var(--pink); }
  h1, h2 { margin: 0; font: 700 2.4rem/1 var(--font-hand); color: var(--paper); }
  h1 { font-size: 3.2rem; text-align: center; text-shadow: 0 0 22px rgba(255,111,165,.55); }
  p { margin: 0; line-height: 1.45; color: #e6def3; }
  .lead { font-size: 1.02rem; }
  .center { text-align: center; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  .btn {
    padding: 14px 22px; border-radius: 999px;
    background: linear-gradient(135deg, var(--pink), var(--violet));
    font: 800 1rem var(--font-display); color: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.25), 0 14px 30px rgba(123,97,255,.35);
    align-self: center;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .ghost {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    font: 500 .85rem var(--font-display); color: var(--muted); align-self: center;
  }
  .hintbox {
    background: rgba(255,200,90,.1); border: 1px solid rgba(255,200,90,.35);
    border-radius: 14px; padding: 10px 14px;
    font: 600 1.25rem/1.2 var(--font-hand); color: var(--gold);
  }

  /* Digit pad */
  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .pad button {
    height: 48px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
    font: 800 1.2rem var(--font-display); font-variant-numeric: tabular-nums;
  }
  .pad button:active { background: rgba(255,111,165,.25); }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
  .say { min-height: 1.4em; font: 600 1.3rem var(--font-hand); color: var(--muted); text-align: center; }
  .say.ok { color: var(--gold); }
  .say.no { color: var(--red); }

  /* 1. Flashlight */
  .dark {
    position: relative; height: min(62vh, 440px); border-radius: 20px; overflow: hidden;
    background:
      radial-gradient(circle at 30% 70%, #4a3b63 0, transparent 60%),
      radial-gradient(circle at 75% 25%, #3d4a6e 0, transparent 55%),
      #3a3150;
    touch-action: none; cursor: none;
    border: 1px solid var(--line);
  }
  .dark .it { position: absolute; transform: translate(-50%, -50%); line-height: 1; pointer-events: none; }
  .dark .shade {
    position: absolute; inset: 0; background: #07050c; pointer-events: none;
    -webkit-mask-image: radial-gradient(circle 64px at var(--x, -200px) var(--y, -200px), transparent 0, transparent 55%, #000 100%);
            mask-image: radial-gradient(circle 64px at var(--x, -200px) var(--y, -200px), transparent 0, transparent 55%, #000 100%);
  }
  .dark .tip {
    position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    font: 600 1.2rem var(--font-hand); color: var(--muted); pointer-events: none; z-index: 2;
    transition: opacity .4s;
  }

  /* 2. Cipher */
  .cipher {
    background: var(--paper); color: var(--ink); border-radius: 18px; padding: 18px 16px;
    font: 800 1.15rem/1.45 var(--font-display); letter-spacing: .06em; text-align: center;
    min-height: 110px; display: grid; place-items: center; word-break: break-word;
    transition: box-shadow .4s;
  }
  .cipher.solved { box-shadow: 0 0 0 4px var(--gold), 0 0 34px rgba(255,200,90,.6); }
  .wheel { display: flex; align-items: center; gap: 10px; }
  .wheel .arrow {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    background: var(--panel); border: 1px solid var(--line); font-size: 1.3rem;
  }
  .strip {
    flex: 1; overflow: hidden; border-radius: 12px; border: 1px solid var(--line);
    font: 800 .95rem var(--font-display); font-variant-numeric: tabular-nums;
  }
  .strip .row { display: flex; justify-content: center; gap: 0; }
  .strip .row span { width: 22px; text-align: center; padding: 5px 0; flex: none; }
  .strip .row.a { background: rgba(255,255,255,.04); color: var(--muted); }
  .strip .row.b { color: var(--gold); }
  .strip .row span.mid { background: rgba(255,111,165,.25); }
  .keylabel { text-align: center; font: 500 .8rem var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* 3. Constellation */
  .sky3 { width: 100%; aspect-ratio: 1; border-radius: 20px; background: rgba(0,0,0,.25); border: 1px solid var(--line); touch-action: manipulation; }
  .sky3 .st { fill: #fff8ef; }
  .sky3 .st.dim { fill: rgba(255,248,239,.45); }
  .sky3 .st.on { fill: var(--gold); filter: drop-shadow(0 0 4px var(--gold)); }
  .sky3 .num { fill: var(--muted); font: 600 10px var(--font-display); pointer-events: none; }
  .sky3 polyline { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(255,200,90,.8)); }
  .sky3 .hit { fill: transparent; cursor: pointer; }
  .sky3.bad { animation: shake .4s ease; }

  /* 4. Cats */
  .note {
    background: var(--paper); color: var(--ink); border-radius: 16px; padding: 14px 16px;
    font: 600 1.3rem/1.25 var(--font-hand); transform: rotate(-1deg);
  }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 12px 6px 10px; display: grid; justify-items: center; gap: 6px; text-align: center;
    transition: transform .2s, border-color .2s;
  }
  .cat:active { transform: scale(.96); }
  .cat .face { font-size: 2.6rem; line-height: 1; }
  .cat b { font: 800 .9rem var(--font-display); }
  .cat i { font: 600 1.1rem/1.15 var(--font-hand); font-style: normal; color: #e6def3; }
  .cat .collar { font: 800 .7rem var(--font-display); color: var(--ink); background: var(--gold); border-radius: 999px; padding: 2px 8px; }
  .cat.guilty { border-color: var(--gold); box-shadow: 0 0 24px rgba(255,200,90,.45); }
  .cat.hiss { border-color: var(--red); }

  /* 5. Chest + combo lock */
  .chest { width: 190px; height: 160px; align-self: center; overflow: visible; }
  .chest .lid { transform-origin: 20px 72px; transition: transform 1.1s cubic-bezier(.3,1.5,.5,1); }
  .chest.open .lid { transform: translateY(-14px) rotate(-16deg); }
  .chest .glow { opacity: 0; transition: opacity 1s .3s; }
  .chest.open .glow { opacity: 1; }
  .combo { display: flex; justify-content: center; gap: 10px; }
  .dial { display: grid; gap: 4px; justify-items: center; }
  .dial button { width: 54px; height: 38px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: .9rem; color: var(--muted); }
  .dial .v {
    width: 54px; height: 62px; border-radius: 12px; background: var(--paper); color: var(--ink);
    display: grid; place-items: center; font: 800 2rem var(--font-display); font-variant-numeric: tabular-nums;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.08);
  }

  .letter {
    background: var(--paper); color: var(--ink); border-radius: 20px; padding: 22px 20px;
    font: 600 1.35rem/1.3 var(--font-hand);
    box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 24px 50px rgba(0,0,0,.4);
    animation: rise 1s ease .8s both;
  }
  .letter p { color: var(--ink); margin-bottom: 10px; }
  .letter .sign { text-align: right; color: #6b5f7d; margin: 6px 0 0; }

  @media (prefers-reduced-motion: reduce) {
    .scene, .letter { animation: none; }
    .chest .lid, .lock { transition: none; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">
  <div class="locks" id="locks" aria-label="Знайдені цифри"></div>
  <main id="stage" aria-live="polite"></main>
</div>
<canvas id="fx"></canvas>

<script>
(() => {
  // ======= Тут можна міняти тексти =======
  const FINAL_LETTER = [
    'Ти пройшла всі чотири замки.',
    'Котів у темряві порахувала, шифр зламала, сузір\'я склала, злочинця вирахувала. Шерлок нервово курить.',
    'А в скриньці ось що:',
    '— ти розумна (щойно довела);<br>— ти смілива (полізла в темряву з ліхтариком);<br>— і ти заслуговуєш на пригоди, а не на драми.',
    'Тож наступний квест — уже наживо. Готуйся 😉',
  ];
  const SIGNATURE = 'від того, хто на твоїй стороні';
  // =======================================

  const CODE = [7, 2, 3, 6];
  const KEY = 'nichna-skrynka-v1';
  const $ = s => document.querySelector(s);
  const stage = $('#stage');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Saved progress ----------
  let state = { step: 0, got: [] };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s.step === 'number') state = s; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  // ---------- Locks bar ----------
  function drawLocks() {
    const box = $('#locks');
    box.innerHTML = '';
    box.hidden = state.step === 0;
    CODE.forEach((d, i) => {
      const el = document.createElement('div');
      const has = state.got[i] !== undefined;
      el.className = 'lock' + (has ? ' got' : '') + (!has && state.step === i + 1 ? ' now' : '');
      el.textContent = has ? state.got[i] : '?';
      box.appendChild(el);
    });
  }

  // ---------- Helpers ----------
  function scene(html) {
    stage.innerHTML = `<section class="scene">${html}</section>`;
    scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
    return stage.firstElementChild;
  }
  function hints(root, list) {
    const btn = root.querySelector('.ghost.hintbtn');
    const box = root.querySelector('.hints');
    let n = 0;
    btn.onclick = () => {
      if (n >= list.length) return;
      const h = document.createElement('div');
      h.className = 'hintbox';
      h.textContent = '💡 ' + list[n++];
      box.appendChild(h);
      if (n >= list.length) btn.hidden = true;
    };
  }
  function pad(root, answer, onOk, wrongLines) {
    const p = root.querySelector('.pad');
    const say = root.querySelector('.say');
    let miss = 0;
    for (let d = 1; d <= 10; d++) {
      const v = d % 10;
      const b = document.createElement('button');
      b.textContent = v;
      b.onclick = e => {
        if (v === answer) {
          say.className = 'say ok'; say.textContent = 'Так! Цифра ' + v + ' — твоя.';
          const r = b.getBoundingClientRect();
          burst(r.left + r.width / 2, r.top, ['✨', '⭐', '💛'], 14);
          p.querySelectorAll('button').forEach(x => x.disabled = true);
          setTimeout(onOk, 1100);
        } else {
          say.className = 'say no'; say.textContent = wrongLines[miss++ % wrongLines.length];
          p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
        }
      };
      p.appendChild(b);
    }
  }
  function gotDigit(i, d) {
    state.got[i] = d;
    state.step = i + 2;
    save();
    drawLocks();
    const el = $('#locks').children[i];
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, ['⭐', '✨'], 10);
    setTimeout(go, 700);
  }
  const NO = ['Неа. Ще раз 🙂', 'Близько… а може й ні', 'Мачки сміються. Ще спроба', 'Не та цифра'];

  // ---------- 0. Intro ----------
  function intro() {
    const s = scene(`
      <div style="height:8vh"></div>
      <div class="center" style="font-size:4.2rem">🗝️</div>
      <h1>Нічна скринька</h1>
      <p class="lead center">Хтось замкнув під зорями скриньку. На ній кодовий замок на чотири цифри.</p>
      <p class="lead center">Кожна цифра схована за загадкою. Знайдеш усі чотири — відкриєш.</p>
      <p class="center" style="color:var(--muted)">Застрягнеш — тисни «Підказка». Тут ніхто не судить.</p>
      <div style="height:10px"></div>
      <button class="btn" id="start">Почати квест</button>`);
    s.querySelector('#start').onclick = () => { state.step = 1; save(); drawLocks(); go(); };
  }

  // ---------- 1. Flashlight ----------
  function flashlight() {
    // x%, y%, emoji, size(px)
    const things = [
      [14, 18, '🐈‍⬛', 34], [78, 12, '🐈‍⬛', 30], [52, 40, '🐈‍⬛', 40], [86, 55, '🐈‍⬛', 26],
      [22, 62, '🐈‍⬛', 32], [62, 82, '🐈‍⬛', 30], [8, 90, '🐈‍⬛', 22],
      [40, 14, '🐈', 32], [70, 34, '🧶', 26], [30, 40, '🐟', 24], [88, 85, '🦇', 26],
      [45, 66, '🌙', 26], [12, 40, '🧦', 22], [92, 30, '🐾', 20], [36, 88, '🐭', 22],
    ];
    const s = scene(`
      <span class="tag">Замок 1 з 4</span>
      <h2>Ліхтарик</h2>
      <p>Світло вимкнули. Води пальцем по темряві — це ліхтарик. Порахуй <b>чорних котів</b>, що там ховаються.</p>
      <div class="dark" id="dark">
        ${things.map(([x, y, e, f]) => `<span class="it" style="left:${x}%;top:${y}%;font-size:${f}px">${e}</span>`).join('')}
        <div class="shade" id="shade"></div>
        <div class="tip" id="tip">води тут пальцем 👆</div>
      </div>
      <p class="center">Скільки чорних котів?</p>
      <div class="pad"></div>
      <div class="say"></div>
      <button class="ghost hintbtn">Підказка</button>
      <div class="hints"></div>`);
    const dark = s.querySelector('#dark'), shade = s.querySelector('#shade'), tip = s.querySelector('#tip');
    const move = e => {
      const r = dark.getBoundingClientRect();
      shade.style.setProperty('--x', (e.clientX - r.left) + 'px');
      shade.style.setProperty('--y', (e.clientY - r.top) + 'px');
      tip.style.opacity = 0;
    };
    dark.addEventListener('pointerdown', e => { dark.setPointerCapture(e.pointerId); move(e); });
    dark.addEventListener('pointermove', move);
    hints(s, [
      'Рудий кіт не рахується — він не чорний, він просто нахаба.',
      'Обшукай усі кути, особливо низ ліворуч.',
      'Їх сім. Сім чорних котів. Це підозріло, але факт.',
    ]);
    pad(s, 7, () => gotDigit(0, 7), NO);
  }

  // ---------- 2. Cipher ----------
  const ABC = 'АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ';
  const PLAIN = 'ДРУГА ЦИФРА — СТІЛЬКИ, СКІЛЬКИ В ТЕБЕ ОЧЕЙ';
  const shift = (t, k) => [...t].map(c => { const i = ABC.indexOf(c); return i < 0 ? c : ABC[((i + k) % 33 + 33) % 33]; }).join('');
  const SECRET = shift(PLAIN, 7);
  function cipher() {
    const s = scene(`
      <span class="tag">Замок 2 з 4</span>
      <h2>Шифр</h2>
      <p>На кришці скриньки — дивний напис. Кожну літеру зсунули по абетці на однакову кількість кроків. Покрути колесо, поки не стане читатись.</p>
      <div class="cipher" id="txt"></div>
      <div class="wheel">
        <button class="arrow" id="l" aria-label="Назад">◀</button>
        <div class="strip"><div class="row a" id="ra"></div><div class="row b" id="rb"></div></div>
        <button class="arrow" id="r" aria-label="Вперед">▶</button>
      </div>
      <div class="keylabel" id="kl"></div>
      <div id="after" hidden>
        <p class="center" style="margin-bottom:10px">То яка друга цифра?</p>
        <div class="pad"></div>
        <div class="say"></div>
      </div>
      <button class="ghost hintbtn">Підказка</button>
      <div class="hints"></div>`);
    let k = 0;
    const txt = s.querySelector('#txt'), ra = s.querySelector('#ra'), rb = s.querySelector('#rb'), kl = s.querySelector('#kl');
    const SHOW = 9; // letters visible on each side
    function draw() {
      txt.textContent = shift(SECRET, -k);
      const a = [], b = [];
      for (let i = -Math.floor(SHOW / 2); i <= Math.floor(SHOW / 2); i++) {
        const j = ((i % 33) + 33) % 33;
        const cls = i === 0 ? ' class="mid"' : '';
        a.push(`<span${cls}>${ABC[(j + k) % 33]}</span>`);
        b.push(`<span${cls}>${ABC[j]}</span>`);
      }
      ra.innerHTML = a.join(''); rb.innerHTML = b.join('');
      kl.textContent = 'ключ: ' + k;
      const ok = k === 7;
      txt.classList.toggle('solved', ok);
      if (ok && s.querySelector('#after').hidden) {
        s.querySelector('#after').hidden = false;
        const r = txt.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2, ['✨', '🔓'], 12);
      }
    }
    s.querySelector('#l').onclick = () => { k = (k + 32) % 33; draw(); };
    s.querySelector('#r').onclick = () => { k = (k + 1) % 33; draw(); };
    draw();
    hints(s, [
      'Ключ ти вже знаєш — він з першого замка.',
      'Скільки було чорних котів? Стільки разів і тисни ▶.',
      'Ключ — 7. А очей у тебе… ну, порахуй 🙂',
    ]);
    pad(s, 2, () => gotDigit(1, 2), NO);
  }

  // ---------- 3. Constellation ----------
  function constellation() {
    const path = [[85, 75], [150, 48], [215, 75], [222, 125], [160, 150], [228, 180], [225, 232], [150, 258], [82, 232]];
    const decoys = [[40, 30], [262, 40], [30, 150], [110, 120], [270, 140], [120, 200], [40, 270], [270, 270], [190, 20], [100, 160], [260, 215], [180, 205]];
    const s = scene(`
      <span class="tag">Замок 3 з 4</span>
      <h2>Сузір'я</h2>
      <p>На внутрішній стороні кришки — карта неба. Торкайся зір по черзі, від 1 до 9. Що вийде — те й цифра.</p>
      <svg class="sky3" id="sk" viewBox="0 0 300 300">
        <polyline id="pl" points=""/>
        ${decoys.map(([x, y]) => `<circle class="st dim" cx="${x}" cy="${y}" r="${1.6 + (x * y % 3) * .6}"/>`).join('')}
        ${path.map(([x, y], i) => `
          <circle class="st" data-i="${i}" cx="${x}" cy="${y}" r="4.5"/>
          <text class="num" x="${x + 8}" y="${y - 7}">${i + 1}</text>
          <circle class="hit" data-i="${i}" cx="${x}" cy="${y}" r="20"/>`).join('')}
      </svg>
      <div id="after" hidden>
        <p class="center" style="margin-bottom:10px">Що за цифру намалювали зорі?</p>
        <div class="pad"></div>
        <div class="say"></div>
      </div>
      <button class="ghost hintbtn">Підказка</button>
      <div class="hints"></div>`);
    const sk = s.querySelector('#sk'), pl = s.querySelector('#pl');
    let next = 0;
    const pts = [];
    sk.querySelectorAll('.hit').forEach(h => h.addEventListener('click', () => {
      const i = +h.dataset.i;
      if (i < next) return;
      if (i !== next) { sk.classList.remove('bad'); void sk.getBoundingClientRect(); sk.classList.add('bad'); return; }
      next++;
      pts.push(path[i].join(','));
      pl.setAttribute('points', pts.join(' '));
      sk.querySelector(`.st[data-i="${i}"]`).classList.add('on');
      if (next === path.length) {
        const r = sk.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2, ['⭐', '✨', '🌟'], 16);
        s.querySelector('#after').hidden = false;
        setTimeout(() => s.querySelector('#after').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }), 200);
      }
    }));
    hints(s, [
      'Номерки дрібні, біля кожної зорі. Почни з 1 угорі ліворуч.',
      'Глянь на малюнок, ніби це почерк. Яка цифра схожа на два горбики?',
      'Це трійка 🙂',
    ]);
    pad(s, 3, () => gotDigit(2, 3), NO);
  }

  // ---------- 4. Cat detectives ----------
  function cats() {
    const list = [
      { name: 'Мурчик', face: '😼', n: 4, says: '«Ковбасу з\'їла Сажа»' },
      { name: 'Сажа', face: '🐈‍⬛', n: 1, says: '«Я ковбаси не їла»' },
      { name: 'Пушок', face: '😺', n: 6, says: '«Я теж не їв»' },
    ];
    const s = scene(`
      <span class="tag">Замок 4 з 4</span>
      <h2>Хто з'їв ковбасу?</h2>
      <p>Останню цифру сторожили три коти. Поки ти розгадувала шифри, хтось із них з'їв ковбасу, що лежала на скриньці.</p>
      <div class="note">Відомо точно: <b>правду каже лише один кіт</b>. Решта брешуть, бо коти.</div>
      <div class="cats">
        ${list.map((c, i) => `
          <button class="cat" data-i="${i}">
            <span class="face">${c.face}</span>
            <b>${c.name}</b>
            <i>${c.says}</i>
            <span class="collar">№ ${c.n}</span>
          </button>`).join('')}
      </div>
      <p class="center" style="color:var(--muted)">Тицни на злочинця. Номер на його нашийнику — остання цифра.</p>
      <div class="say"></div>
      <button class="ghost hintbtn">Підказка</button>
      <div class="hints"></div>`);
    const say = s.querySelector('.say');
    const why = [
      'Якщо винен Мурчик, то і Сажа, і Пушок кажуть правду — а правдивий лише один. Не він.',
      'Якщо винна Сажа, то Мурчик і Пушок кажуть правду — двоє. Не вона.',
    ];
    let done = false;
    s.querySelectorAll('.cat').forEach(b => b.onclick = () => {
      if (done) return;
      const i = +b.dataset.i;
      if (i === 2) {
        done = true;
        b.classList.add('guilty');
        b.querySelector('.face').textContent = '🙀';
        say.className = 'say ok';
        say.textContent = 'Попався, Пушок! Правду казала лише Сажа.';
        const r = b.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top, ['🌭', '✨', '⭐'], 14);
        setTimeout(() => gotDigit(3, 6), 1500);
      } else {
        b.classList.add('hiss');
        say.className = 'say no';
        say.textContent = 'Пшшш! 😾 ' + why[i];
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        setTimeout(() => b.classList.remove('hiss'), 900);
      }
    });
    hints(s, [
      'Перебери по черзі: «а що, як винен ось цей?» — і порахуй, скільки котів тоді кажуть правду.',
      'Правильний варіант той, де правдивий рівно один кіт.',
      'Сажа каже правду. Значить, Мурчик бреше (Сажа не винна), а Пушок… теж бреше 🌭',
    ]);
  }

  // ---------- 5. Chest ----------
  function chest() {
    const s = scene(`
      <span class="tag">Всі цифри знайдені</span>
      <h2 class="center">Скринька</h2>
      <svg class="chest" id="ch" viewBox="0 0 190 160" aria-hidden="true">
        <ellipse class="glow" cx="95" cy="70" rx="80" ry="40" fill="rgba(255,200,90,.55)" style="filter:blur(14px)"/>
        <rect x="20" y="70" width="150" height="80" rx="10" fill="#8a4b2d"/>
        <rect x="20" y="70" width="150" height="14" fill="#6e3a22"/>
        <rect x="88" y="70" width="14" height="80" fill="#ffc85a"/>
        <g class="lid">
          <path d="M20 72 V50 Q95 10 170 50 V72 Z" fill="#a35a36"/>
          <rect x="88" y="26" width="14" height="46" fill="#ffc85a"/>
          <rect x="83" y="60" width="24" height="22" rx="4" fill="#ffd97a" stroke="#6e3a22" stroke-width="2"/>
        </g>
      </svg>
      <p class="center">Введи код, який зібрала.</p>
      <div class="combo" id="combo"></div>
      <div class="say"></div>
      <div id="letter"></div>`);
    const combo = s.querySelector('#combo'), say = s.querySelector('.say'), ch = s.querySelector('#ch');
    const v = [0, 0, 0, 0];
    let opened = false;
    v.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dial';
      d.innerHTML = `<button aria-label="Більше">▲</button><div class="v">0</div><button aria-label="Менше">▼</button>`;
      const [up, , down] = d.children, val = d.querySelector('.v');
      const set = dv => { if (opened) return; v[i] = (v[i] + dv + 10) % 10; val.textContent = v[i]; check(); };
      up.onclick = () => set(1); down.onclick = () => set(-1);
      combo.appendChild(d);
    });
    function check() {
      if (v.join('') !== CODE.join('')) { say.textContent = ''; return; }
      opened = true;
      say.className = 'say ok'; say.textContent = 'Клац!';
      ch.classList.add('open');
      combo.style.opacity = .4;
      const r = ch.getBoundingClientRect();
      let t = 0;
      const fire = setInterval(() => {
        burst(r.left + r.width / 2, r.top + r.height * .45, ['⭐', '✨', '💛', '🌟'], 6, true);
        if (++t > (reduced ? 2 : 14)) clearInterval(fire);
      }, 120);
      state.step = 6; save();
      showLetter(s.querySelector('#letter'));
      setTimeout(() => s.querySelector('#letter').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }), 1300);
    }
  }
  function showLetter(box) {
    box.innerHTML = `<div class="letter">${FINAL_LETTER.map(l => `<p>${l}</p>`).join('')}<p class="sign">— ${SIGNATURE}</p></div>
      <div style="height:18px"></div>
      <button class="ghost" id="again" style="display:block;margin:0 auto">Пройти ще раз</button>`;
    box.querySelector('#again').onclick = () => { state = { step: 0, got: [] }; save(); drawLocks(); go(); };
  }
  function finished() {
    const s = scene(`
      <h2 class="center">Скринька відкрита</h2>
      <div id="letter"></div>`);
    showLetter(s.querySelector('#letter'));
  }

  // ---------- Router ----------
  const steps = [intro, flashlight, cipher, constellation, cats, chest, finished];
  function go() { drawLocks(); (steps[state.step] || intro)(); }

  // ---------- FX: emoji bursts + sky ----------
  const fx = $('#fx'), ctx = fx.getContext('2d');
  let W, H, DPR;
  const sprites = new Map(), bits = [];
  function sprite(ch) {
    let s = sprites.get(ch);
    if (s) return s;
    s = document.createElement('canvas');
    s.width = s.height = 64 * DPR;
    const g = s.getContext('2d');
    g.font = `${51 * DPR}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, s.width / 2, s.height / 2 + 3 * DPR);
    sprites.set(ch, s);
    return s;
  }
  function burst(x, y, set, n = 8, up = false) {
    if (reduced) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) {
      if (bits.length > 160) bits.shift();
      const ch = set[(Math.random() * set.length) | 0];
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      bits.push({
        ch, img: sprite(ch), x, y,
        vx: up ? (Math.random() - .5) * 4 : Math.cos(a) * sp,
        vy: up ? -(4 + Math.random() * 6) : Math.sin(a) * sp - 3,
        g: up ? .08 : .28, rot: (Math.random() - .5) * .6, vr: (Math.random() - .5) * .15,
        size: 18 + Math.random() * 18, life: 75,
      });
    }
  }
  let dirty = false;
  function loop() {
    if (bits.length || dirty) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, fx.width, fx.height);
      dirty = bits.length > 0;
    }
    let alive = 0;
    for (const b of bits) {
      if (--b.life <= 0) continue;
      bits[alive++] = b;
      b.vy += b.g; b.vx *= .98; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      const c = Math.cos(b.rot) * DPR, sn = Math.sin(b.rot) * DPR, r = b.size / 2;
      ctx.setTransform(c, sn, -sn, c, b.x * DPR, b.y * DPR);
      ctx.globalAlpha = b.life < 25 ? b.life / 25 : 1;
      ctx.drawImage(b.img, -r, -r, b.size, b.size);
    }
    bits.length = alive;
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  function drawSky() {
    const c = $('#sky'), g = c.getContext('2d');
    c.width = W * DPR; c.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round(W * H / 5000);
    g.fillStyle = '#fff8ef';
    for (let i = 0; i < n; i++) {
      g.globalAlpha = .12 + Math.random() * .45;
      g.beginPath();
      g.arc(Math.random() * W, Math.random() * H, Math.random() * 1.2 + .2, 0, Math.PI * 2);
      g.fill();
    }
  }
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    fx.width = W * DPR; fx.height = H * DPR;
    sprites.clear();
    for (const b of bits) b.img = sprite(b.ch);
    drawSky();
  }
  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(loop);
  go();
})();
</script>
</body>
</html>
