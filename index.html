<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Клацай, Яно</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&family=Caveat:wght@600;700&display=swap">
<style>
  /* Layout: night sky; a deck of 15 cards in the middle; jar of warmth bottom-left, trash bin bottom-right.
     Each tap flips the next card; the previous one flies off: compliments become stars, support fills the jar, cards about him get crumpled into the bin. */
  :root {
    --night: #120e1c;
    --night-hi: #2a2142;
    --paper: #fff8ef;
    --ink: #221a2e;
    --pink: #ff6fa5;
    --violet: #7b61ff;
    --teal: #2ec4b6;
    --red: #ff3b30;
    --gold: #ffc85a;
    --muted: #a99fc0;
    --font-display: "Rubik", "Segoe UI", system-ui, sans-serif;
    --font-hand: "Caveat", "Segoe Print", cursive;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--night-hi) 0%, var(--night) 70%);
    background-color: var(--night);
    color: var(--paper);
    font-family: var(--font-display);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  #sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fx { z-index: 50; }
  #stars { position: fixed; inset: 0; pointer-events: none; }

  .star {
    position: absolute;
    width: 0; height: 0;
    font-size: 26px; line-height: 0;
    color: var(--gold);
    text-shadow: 0 0 12px var(--gold), 0 0 28px rgba(255, 200, 90, .6);
    animation: star-in .6s cubic-bezier(.3,1.8,.5,1) both, twinkle 2.6s ease-in-out .6s infinite;
  }
  .star::before { content: "✦"; position: absolute; transform: translate(-50%, 0); }
  .star.bright { font-size: 38px; }
  @keyframes star-in { from { transform: scale(0) rotate(-90deg); } }
  @keyframes twinkle { 50% { opacity: .55; } }

  /* Deck */
  .deck {
    position: fixed;
    left: 50%; top: 42%;
    width: min(84vw, 340px);
    height: 230px;
    transform: translate(-50%, -50%);
    z-index: 10;
  }
  .card {
    position: absolute; inset: 0;
    perspective: 1100px;
    transition: transform .35s ease;
  }
  .flip {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.3,1.35,.5,1);
  }
  .card.open .flip { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    border-radius: 22px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 8px 0 rgba(0,0,0,.25), 0 22px 44px rgba(0,0,0,.35);
  }
  .back {
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.25) 0 2px, transparent 3px) 0 0 / 22px 22px,
      linear-gradient(135deg, var(--pink), var(--violet));
    display: grid; place-items: center; align-content: center; gap: 2px;
    color: var(--paper);
    box-shadow: inset 0 0 0 7px rgba(255,255,255,.18), 0 8px 0 rgba(0,0,0,.25), 0 22px 44px rgba(0,0,0,.35);
  }
  .back b { font: 700 4.4rem/1 var(--font-hand); }
  .back small { font: 500 .75rem var(--font-display); letter-spacing: .2em; text-transform: uppercase; opacity: .85; }
  .front {
    transform: rotateY(180deg);
    background: var(--paper);
    color: var(--ink);
    padding: 20px 20px 16px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
  }
  .chip {
    justify-self: start;
    font: 800 .7rem var(--font-display);
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--paper);
    background: var(--c);
    padding: 5px 10px; border-radius: 999px;
  }
  .msg {
    margin: 0; align-self: center;
    font: 800 clamp(1.1rem, 4.8vw, 1.45rem) / 1.22 var(--font-display);
    text-wrap: balance;
  }
  .foot {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    font: 600 1.1rem var(--font-hand);
    color: #6b5f7d;
  }
  .foot span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Tray: jar, counter, bin */
  .tray {
    position: fixed; left: 0; right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    pointer-events: none;
    z-index: 5;
  }
  .slot { display: grid; justify-items: center; gap: 6px; width: 84px; }
  .slot span { font: 500 .7rem var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .jar {
    position: relative;
    width: 54px; height: 66px;
    border: 3px solid rgba(255,248,239,.55);
    border-top-width: 6px;
    border-radius: 10px 10px 16px 16px;
    overflow: hidden;
    transition: box-shadow .5s ease;
  }
  .jar .fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 0%;
    background: linear-gradient(180deg, #ffe08a, var(--gold) 60%, #ff9f43);
    box-shadow: 0 0 18px var(--gold);
    transition: height .6s cubic-bezier(.3,1.4,.5,1);
  }
  .jar.pulse { animation: jar-pulse .5s ease; }
  .jar.glow { box-shadow: 0 0 30px 6px rgba(255, 200, 90, .55); }
  @keyframes jar-pulse { 40% { transform: scale(1.15); } }
  .bin { position: relative; font-size: 52px; line-height: 1; }
  .bin.shake { animation: shake .45s ease; }
  @keyframes shake {
    20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); }
    60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); }
  }
  .middle { display: grid; justify-items: center; gap: 4px; padding-bottom: 6px; }
  .counter { font: 800 1.1rem var(--font-display); font-variant-numeric: tabular-nums; }
  .hint {
    font: 500 .7rem var(--font-display); letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .35; } }

  .finale {
    position: fixed; left: 0; right: 0; top: 42%;
    transform: translateY(-50%);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    font: 700 clamp(2.2rem, 9vw, 3.6rem) / 1.1 var(--font-hand);
    text-shadow: 0 0 20px rgba(255, 111, 165, .6);
    z-index: 20;
    pointer-events: none;
  }
  .finale > div { opacity: 0; transform: translateY(14px) scale(.96); transition: opacity 1.2s ease, transform 1.2s ease; }
  .finale.show > div { opacity: 1; transform: none; }
  .finale.show > div:nth-child(2) { transition-delay: 1.1s; color: var(--gold); text-shadow: 0 0 20px rgba(255, 200, 90, .7); }

  @media (prefers-reduced-motion: reduce) {
    .hint, .star { animation: none; }
    .flip { transition-duration: .01s; }
  }
</style>

<canvas id="sky"></canvas>
<div id="stars"></div>
<main class="deck" id="deck" aria-live="polite"></main>
<div class="finale" id="finale" hidden>
  <div>Він — у смітнику.</div>
  <div>Ти — серед зірок.</div>
</div>
<div class="tray">
  <div class="slot"><div class="jar" id="jar"><div class="fill" id="fill"></div></div><span>тепло</span></div>
  <div class="middle"><div class="counter" id="counter">0 / 15</div><div class="hint" id="hint">клацай по екрану</div></div>
  <div class="slot"><div class="bin" id="bin">🗑️</div><span>сюди його</span></div>
</div>
<canvas id="fx"></canvas>

<script>
(() => {
  const kinds = {
    love:  { label: 'Комплімент', color: 'var(--pink)' },
    hug:   { label: 'Підтримка',  color: 'var(--teal)' },
    roast: { label: 'Про нього',  color: 'var(--red)' },
  };
  // Exactly 15 cards, each shown once, in this order
  const cards = [
    ['love',  'Яно, ти файна. Без причини. Просто факт.'],
    ['hug',   'Ти не винна. Ні грама. Він сам так вибрав.'],
    ['roast', 'Він тебе недостойний. І не був. І не буде.'],
    ['love',  'У тебе такий сміх, што навіть понеділок ся налаштовує на добре.'],
    ['roast', 'Він — хуєсос. То не образа, то діагноз.'],
    ['hug',   'Поплакати — нормально. Лем не за ним довго, він того не вартий.'],
    ['love',  'Навіть сумна ти виглядаєш ліпше, ги більшість людей у найліпший день.'],
    ['hug',   'Ти заслуговуєш на того, хто тобов буде гордитися, а не ховатися.'],
    ['roast', 'Зрадити тебе — то ги викинути золото й лишити си обгортку від цукерки.'],
    ['love',  'Твоя усмішка — то окремий вид опалення. Зимою дуже треба.'],
    ['roast', 'Мачки на нього шиплять. Мачки знають.'],
    ['hug',   'Через рік ти будеш ся сміяти, ги на нього тратила час.'],
    ['love',  'У тебе добре серце. Тото рідкість, бережи го.'],
    ['roast', 'Твоє життя — кіно. Він був рекламою посередині. Перемотуємо.'],
    ['hug',   'Ти не одна. Ніколи.'],
  ];
  const TOTAL = cards.length;
  const HUGS = cards.filter(c => c[0] === 'hug').length;

  const $ = id => document.getElementById(id);
  const deck = $('deck'), jar = $('jar'), fill = $('fill'), bin = $('bin');
  const counter = $('counter'), hint = $('hint'), starsBox = $('stars'), finaleEl = $('finale');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduced ? 0.4 : 1;

  // ---------- Build the deck ----------
  const els = cards.map(([kind, text], i) => {
    const k = kinds[kind];
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="flip">
        <div class="face back"><b>Я</b><small>№ ${i + 1}</small></div>
        <div class="face front" style="--c:${k.color}">
          <span class="chip">${k.label}</span>
          <p class="msg"></p>
          <div class="foot"><span>від того, хто на твоїй стороні</span><span>${i + 1} / ${TOTAL}</span></div>
        </div>
      </div>`;
    el.querySelector('.msg').textContent = text;
    deck.appendChild(el);
    return el;
  });

  let top = 0;          // index of the card currently on top of the deck
  let revealed = false; // is the top card flipped face-up
  let done = false;
  let hugs = 0;
  let lock = 0;

  function layout() {
    els.forEach((el, i) => {
      if (i < top) return;
      const d = i - top;
      const s = Math.min(d, 5);
      el.style.zIndex = 100 - d;
      el.style.transform = `translate(${s * 4}px, ${s * -5}px) rotate(${s * 1.2}deg)`;
      el.style.visibility = d > 6 ? 'hidden' : 'visible';
    });
  }

  // ---------- Effects canvas: cached emoji sprites ----------
  const fx = $('fx');
  const ctx = fx.getContext('2d');
  let W, H, DPR;
  const SPRITE = 64, MAX = 160;
  const sprites = new Map();
  const bits = [];
  function sprite(ch) {
    let s = sprites.get(ch);
    if (s) return s;
    s = document.createElement('canvas');
    s.width = s.height = SPRITE * DPR;
    const g = s.getContext('2d');
    g.font = `${SPRITE * 0.8 * DPR}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, s.width / 2, s.height / 2 + SPRITE * 0.05 * DPR);
    sprites.set(ch, s);
    return s;
  }
  function burst(x, y, set, n = 8, up = false) {
    if (reduced) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) {
      if (bits.length >= MAX) bits.shift();
      const ch = set[(Math.random() * set.length) | 0];
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      bits.push({
        ch, img: sprite(ch), x, y,
        vx: up ? (Math.random() - 0.5) * 2.5 : Math.cos(a) * sp,
        vy: up ? -(4 + Math.random() * 5) : Math.sin(a) * sp - 3,
        g: up ? 0.06 : 0.28,
        rot: (Math.random() - 0.5) * 0.6, vr: (Math.random() - 0.5) * 0.15,
        size: up ? 22 + Math.random() * 22 : 20 + Math.random() * 16,
        life: up ? 70 : 80,
      });
    }
  }
  let dirty = false;
  function loop() {
    if (bits.length || dirty) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, fx.width, fx.height);
      dirty = bits.length > 0;
    }
    let alive = 0;
    for (let i = 0; i < bits.length; i++) {
      const b = bits[i];
      if (--b.life <= 0) continue;
      bits[alive++] = b;
      b.vy += b.g; b.vx *= 0.98;
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      const r = b.size / 2;
      const c = Math.cos(b.rot) * DPR, s = Math.sin(b.rot) * DPR;
      ctx.setTransform(c, s, -s, c, b.x * DPR, b.y * DPR);
      ctx.globalAlpha = b.life < 25 ? b.life / 25 : 1;
      ctx.drawImage(b.img, -r, -r, b.size, b.size);
    }
    bits.length = alive;
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }

  // ---------- Background sky ----------
  function drawSky() {
    const c = $('sky'), g = c.getContext('2d');
    c.width = W * DPR; c.height = H * DPR;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round(W * H / 5000);
    for (let i = 0; i < n; i++) {
      g.globalAlpha = 0.15 + Math.random() * 0.5;
      g.fillStyle = '#fff8ef';
      g.beginPath();
      g.arc(Math.random() * W, Math.random() * H * 0.8, Math.random() * 1.2 + 0.2, 0, Math.PI * 2);
      g.fill();
    }
  }
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    fx.width = W * DPR; fx.height = H * DPR;
    sprites.clear();
    for (const b of bits) b.img = sprite(b.ch);
    drawSky();
  }

  // ---------- Where things go ----------
  const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const starSpots = [];
  function pickStarSpot() {
    // Upper sky, away from the deck and from other stars
    for (let tries = 0; tries < 30; tries++) {
      const x = W * (0.08 + Math.random() * 0.84);
      const y = H * (0.05 + Math.random() * 0.18);
      if (starSpots.every(([sx, sy]) => Math.hypot(sx - x, sy - y) > 60)) return [x, y];
    }
    return [W * Math.random(), H * 0.1];
  }
  function addStar(x, y) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    starsBox.appendChild(s);
    starSpots.push([x, y]);
  }

  // ---------- Card exits ----------
  function dispose(el, kind) {
    el.style.zIndex = 300;
    el.style.transition = 'none';
    const [cx, cy] = center(el);
    const base = el.style.transform || 'none';
    let anim;
    if (kind === 'love') {
      const [tx, ty] = pickStarSpot();
      const dx = tx - cx, dy = ty - cy;
      anim = el.animate([
        { transform: base, opacity: 1 },
        { transform: `translate(${dx * 0.25}px, ${dy * 0.25 - 30}px) rotate(-10deg) scale(.7)`, opacity: 1, offset: 0.35 },
        { transform: `translate(${dx}px, ${dy}px) rotate(25deg) scale(.03)`, opacity: 0.2 },
      ], { duration: 900 * speed, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'forwards' });
      anim.onfinish = () => { el.remove(); addStar(tx, ty); burst(tx, ty, ['✨', '⭐'], 6); };
    } else if (kind === 'hug') {
      const [tx, ty] = center(jar);
      const dx = tx - cx, dy = ty - cy;
      anim = el.animate([
        { transform: base },
        { transform: `translate(${dx * 0.2}px, -40px) rotate(-6deg) scale(.8)`, offset: 0.3 },
        { transform: `translate(${dx}px, ${dy}px) rotate(-30deg) scale(.05)` },
      ], { duration: 850 * speed, easing: 'cubic-bezier(.5,0,.7,1)', fill: 'forwards' });
      anim.onfinish = () => {
        el.remove();
        hugs++;
        fill.style.height = (hugs / HUGS * 100) + '%';
        jar.classList.remove('pulse'); void jar.offsetWidth; jar.classList.add('pulse');
        burst(tx, ty - 30, ['💛', '🤍'], 5, true);
      };
    } else {
      const [tx, ty] = center(bin);
      const dx = tx - cx, dy = ty - cy;
      anim = el.animate([
        { transform: base, filter: 'none' },
        { transform: 'scale(.82, .62) rotate(-10deg)', filter: 'brightness(.9)', offset: 0.2 },
        { transform: 'scale(.5, .45) rotate(28deg)', filter: 'brightness(.8)', offset: 0.38 },
        { transform: `translate(${dx * 0.5}px, ${Math.min(dy, 0) - 90}px) scale(.28) rotate(200deg)`, filter: 'brightness(.75)', offset: 0.65 },
        { transform: `translate(${dx}px, ${dy}px) scale(.06) rotate(420deg)`, filter: 'brightness(.7)' },
      ], { duration: 1050 * speed, easing: 'ease-in', fill: 'forwards' });
      anim.onfinish = () => {
        el.remove();
        bin.classList.remove('shake'); void bin.offsetWidth; bin.classList.add('shake');
        burst(tx, ty - 20, ['💩', '🤡'], 5);
      };
    }
  }

  // ---------- Finale ----------
  function finale() {
    done = true;
    hint.hidden = true;
    const [bx, by] = center(bin);
    let t = 0;
    const fire = setInterval(() => {
      burst(bx, by - 18, ['🔥'], 3, true);
      if (++t > (reduced ? 4 : 30)) clearInterval(fire);
    }, 110);
    setTimeout(() => {
      starsBox.querySelectorAll('.star').forEach(s => s.classList.add('bright'));
      jar.classList.add('glow');
      finaleEl.hidden = false;
      requestAnimationFrame(() => finaleEl.classList.add('show'));
    }, 600);
  }

  // ---------- Tap ----------
  function tap(x, y) {
    if (done) { burst(x, y, ['✨', '⭐', '🌸'], 6); return; }
    const now = performance.now();
    if (now < lock) return;
    lock = now + 280;

    if (revealed) {
      dispose(els[top], cards[top][0]);
      top++;
      revealed = false;
    }
    if (top < TOTAL) {
      layout();
      const el = els[top];
      setTimeout(() => el.classList.add('open'), revealed ? 0 : 90);
      revealed = true;
      counter.textContent = (top + 1) + ' / ' + TOTAL;
    } else {
      finale();
    }
  }

  addEventListener('pointerdown', e => tap(e.clientX, e.clientY));
  addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(W / 2, H * 0.42); }
  });

  resize();
  layout();
  addEventListener('resize', resize);
  requestAnimationFrame(loop);
})();
</script>
