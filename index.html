<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0b10">
<title>Секретний квест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700;800&display=swap">
<style>
  /* Квест у вигляді чату з «таємним фанатом». 4 лвли:
     1) верифікація пальцем → шкала краси ламається
     2) лови компліменти (міні-гра), 🚩 не чіпати
     3) правда чи фейк — свайпи
     4) скретч-карта → сертифікат
     Тексти — в масивах нижче, у <script>. */
  :root {
    --bg: #0b0b10;
    --bg2: #14141c;
    --bot: #1d1d28;
    --line: rgba(255,255,255,.09);
    --text: #f4f2ff;
    --muted: #8d8aa3;
    --pink: #ff3d8b;
    --violet: #8b5cff;
    --lime: #d4ff3a;
    --red: #ff4b4b;
    --grad: linear-gradient(135deg, #ff3d8b, #8b5cff);
    --font: "Manrope", "Segoe UI", system-ui, sans-serif;
    --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -20%; pointer-events: none;
    background:
      radial-gradient(40% 30% at 15% 10%, rgba(255,61,139,.22), transparent 70%),
      radial-gradient(40% 30% at 90% 80%, rgba(139,92,255,.22), transparent 70%);
    filter: blur(10px);
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

  .app {
    position: relative; height: 100%; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    background: rgba(11,11,16,.75); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    z-index: 5;
  }
  .ava {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    background: var(--grad); display: grid; place-items: center;
    font: 800 1.1rem var(--display); color: #fff;
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--lime);
  }
  .who b { display: block; font: 800 .98rem var(--font); }
  .who span { font-size: .78rem; color: var(--lime); }
  .lvl {
    margin-left: auto; font: 800 .7rem var(--display); letter-spacing: .04em;
    padding: 6px 10px; border-radius: 999px; background: var(--bot); border: 1px solid var(--line); color: var(--muted);
    white-space: nowrap;
  }

  #chat {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 16px 14px 10px;
    display: flex; flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: 20px;
    font: 600 1rem/1.38 var(--font);
    animation: pop .28s cubic-bezier(.3,1.5,.5,1) both;
    word-wrap: break-word;
  }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 6px; }
  .msg.wide { max-width: 100%; width: 100%; padding: 0; background: none; }
  .msg + .msg.me, .msg.me + .msg.bot { margin-top: 8px; }
  .sys {
    align-self: center; margin: 12px 0 6px;
    font: 800 .7rem var(--display); letter-spacing: .08em; text-transform: uppercase;
    color: var(--lime); padding: 6px 12px; border: 1px solid rgba(212,255,58,.35); border-radius: 999px;
    animation: pop .3s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } }
  .typing { display: flex; gap: 4px; padding: 14px 16px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 30% { transform: translateY(-5px); opacity: .5; } }

  .reply {
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    min-height: 66px;
    border-top: 1px solid var(--line);
    background: rgba(11,11,16,.8);
  }
  .reply button {
    padding: 11px 16px; border-radius: 999px;
    border: 1.5px solid var(--pink); color: var(--text);
    font: 800 .95rem var(--font);
    animation: pop .3s ease both;
  }
  .reply button:active { background: var(--pink); }
  .reply .note { align-self: center; margin-right: auto; color: var(--muted); font-size: .85rem; }

  /* Widgets */
  .card {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 24px; padding: 18px;
    display: grid; gap: 12px; justify-items: center; text-align: center;
  }
  .card h3 { margin: 0; font: 800 .8rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .finger {
    position: relative; width: 120px; height: 120px; border-radius: 50%;
    display: grid; place-items: center; touch-action: none;
  }
  .finger svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .finger svg.ring circle { fill: none; stroke-width: 6; }
  .finger .print { width: 64px; height: 64px; stroke: var(--pink); fill: none; stroke-width: 2.4; stroke-linecap: round; transition: stroke .3s; }
  .finger.on .print { stroke: var(--lime); filter: drop-shadow(0 0 8px var(--lime)); }
  .scanline { font: 700 .9rem var(--font); color: var(--muted); min-height: 1.3em; }
  .lines { display: grid; gap: 6px; width: 100%; text-align: left; font: 700 .9rem var(--font); }
  .lines div { animation: pop .3s ease both; }
  .lines .ok { color: var(--lime); }
  .meter { width: 100%; display: grid; gap: 8px; }
  .meter .top { display: flex; justify-content: space-between; font: 800 .85rem var(--display); }
  .meter .num { font-variant-numeric: tabular-nums; }
  .bar { height: 14px; border-radius: 999px; background: #262633; overflow: visible; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--lime), var(--pink)); }
  .meter.boom .num, .meter.boom .top span:first-child { color: var(--red); }
  .meter.boom .bar i { background: linear-gradient(90deg, var(--pink), var(--red)); box-shadow: 0 0 20px var(--red); }
  .glitch { animation: glitch .35s steps(2) 4; }
  @keyframes glitch {
    0% { transform: translate(0); filter: none; }
    25% { transform: translate(-4px, 2px) skewX(6deg); filter: hue-rotate(90deg); }
    50% { transform: translate(4px, -2px); filter: invert(.15); }
    75% { transform: translate(-2px, 0) skewX(-4deg); }
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { padding: 6px 11px; border-radius: 999px; background: rgba(212,255,58,.12); color: var(--lime); font: 800 .85rem var(--font); }

  /* Catch game */
  .game { position: fixed; inset: 0; z-index: 20; background: rgba(8,8,12,.94); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: hidden; touch-action: none; }
  .hud {
    position: absolute; left: 0; right: 0; top: 0; z-index: 2;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .hud b { font: 800 1.6rem var(--display); color: var(--lime); font-variant-numeric: tabular-nums; }
  .hud span { color: var(--muted); font-size: .85rem; font-weight: 700; }
  .hud .gbar { position: absolute; left: 16px; right: 16px; bottom: 0; height: 4px; border-radius: 4px; background: #262633; }
  .hud .gbar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--lime); transition: width .3s; }
  .bub {
    position: absolute; left: 0; top: 0; padding: 12px 16px; border-radius: 999px;
    font: 800 1rem var(--font); white-space: nowrap; color: #fff;
    background: var(--grad); box-shadow: 0 8px 24px rgba(255,61,139,.35);
    will-change: transform;
  }
  .bub.flag { background: #2a1416; border: 1.5px solid var(--red); color: var(--red); box-shadow: none; }
  .bub.pop { animation: bpop .25s ease forwards; }
  @keyframes bpop { to { opacity: 0; scale: 1.5; } }
  .game.hurt { animation: hurt .3s ease; }
  @keyframes hurt { 50% { background: rgba(80,10,20,.94); } }
  .toast {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%);
    font: 800 1.3rem var(--display); color: var(--red); text-align: center; pointer-events: none;
    animation: toast .9s ease forwards; z-index: 3;
  }
  @keyframes toast { from { opacity: 1; } to { opacity: 0; transform: translate(-50%, -110%); } }

  /* Swipe */
  .swipe { position: relative; width: 100%; height: 230px; }
  .scard {
    position: absolute; inset: 0; border-radius: 24px; padding: 22px;
    background: var(--text); color: #15131f;
    display: grid; place-items: center; text-align: center;
    font: 800 1.25rem/1.3 var(--font);
    touch-action: none; cursor: grab;
    box-shadow: 0 14px 30px rgba(0,0,0,.4);
  }
  .scard small { position: absolute; top: 14px; left: 0; right: 0; font: 800 .65rem var(--display); letter-spacing: .1em; color: #9a96ad; }
  .scard .stamp {
    position: absolute; top: 34px; padding: 4px 10px; border-radius: 8px; border: 3px solid;
    font: 800 1rem var(--display); opacity: 0; transform: rotate(-12deg);
  }
  .scard .stamp.yes { right: 18px; color: #17b26a; transform: rotate(12deg); }
  .scard .stamp.no { left: 18px; color: var(--red); }
  .scard.next { transform: scale(.94) translateY(12px); opacity: .6; }
  .sbtns { display: flex; gap: 22px; justify-content: center; }
  .sbtns button {
    width: 62px; height: 62px; border-radius: 50%; font-size: 1.5rem;
    background: var(--bot); border: 1.5px solid var(--line);
  }
  .sbtns button:active { transform: scale(.92); }
  .shint { font: 700 .85rem var(--font); color: var(--muted); min-height: 1.3em; }
  .shint.no { color: var(--red); }
  .shint.ok { color: var(--lime); }

  /* Scratch */
  .scratch { position: relative; width: 100%; height: 200px; border-radius: 22px; overflow: hidden; }
  .scratch .under {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 20px;
    background: var(--grad); color: #fff; text-align: center;
    font: 800 1.2rem/1.3 var(--display);
  }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; transition: opacity .6s; }

  /* Certificate */
  .cert {
    position: relative; border-radius: 26px; padding: 3px; background: linear-gradient(135deg, var(--lime), var(--pink), var(--violet));
    animation: pop .5s cubic-bezier(.3,1.5,.5,1) both;
  }
  .cert > div {
    border-radius: 23px; background: #111118; padding: 24px 20px 58px; text-align: center;
    display: grid; gap: 10px; position: relative; overflow: hidden;
  }
  .cert .t { font: 800 .7rem var(--display); letter-spacing: .2em; color: var(--muted); }
  .cert .name { font: 800 2.4rem/1 var(--display); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cert p { margin: 0; font: 700 1rem/1.4 var(--font); }
  .cert dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 6px 0 0; text-align: left; font-size: .85rem; }
  .cert dt { color: var(--muted); font-weight: 700; }
  .cert dd { margin: 0; font-weight: 800; }
  .cert .seal {
    position: absolute; right: 12px; bottom: 14px; transform: rotate(-14deg);
    border: 3px solid var(--lime); color: var(--lime); border-radius: 10px; padding: 4px 8px;
    font: 800 .7rem var(--display); letter-spacing: .06em; opacity: .9;
  }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

  @media (prefers-reduced-motion: reduce) {
    .msg, .sys, .cert, .reply button { animation: none; }
    .glitch { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="ava">?</div>
    <div class="who"><b>таємний фанат 🕶️</b><span id="status">онлайн</span></div>
    <div class="lvl" id="lvl">лвл 0/4</div>
  </header>
  <div id="chat" aria-live="polite"></div>
  <div class="reply" id="reply"></div>
</div>
<canvas id="fx"></canvas>

<script>
(() => {
  // ================== ТЕКСТИ ==================
  const NAME = 'Яна';

  // Лвл 2: компліменти, які падають (лови!) і червоні прапорці (не чіпай)
  const COMPLIMENTS = [
    'файна 🔥', 'очі — космос', 'усмішка 10/10', 'вайб — імба', 'барз красна',
    'краш усього Закарпаття', 'айконік', 'слей 💅', 'сонечко 🌞', 'богиня',
    'ги з обкладинки', 'фурт топ', 'без фільтрів 🔥', 'розумна й файна', 'зорі завидують',
    'головна героїня', 'сяєш ✨', 'красуня', 'серце золоте', 'ги з тіктоку, лем ліпша',
    'гет найкраща', 'губки 💋', 'волосся — вау', 'мейн character', 'королева 👑',
  ];
  const FLAGS = ['🚩 кринж', '🚩 твій екс', '🚩 сумно', '🚩 токсик', '🚩 ігнор', '🚩 «ти звичайна»'];
  const NEED = 12;

  // Лвл 3: правда чи фейк. true = правда (свайп вправо)
  const STATEMENTS = [
    ['Ти барз файна', true],
    ['Ти звичайна', false],
    ['Твої очі можна ставити на заставку', true],
    ['Кедь ти ся смієш, світ ставить на паузу', true],
    ['Тобі треба ся міняти, жеб тя любили', false],
    ['Твоя краса — то не фільтр, то дефолт', true],
    ['Десь є дівка файніша за тя', false],
  ];

  // Лвл 4: напис під скретч-шаром
  const SCRATCH_TEXT = 'Найфайніша дівка на всьому Закарпатті — ти. Без фільтрів. Без конкурентів.';

  const SIGNATURE = 'від того, хто на твоїй стороні 🖤';
  // ============================================

  const $ = s => document.querySelector(s);
  const chat = $('#chat'), reply = $('#reply'), statusEl = $('#status'), lvlEl = $('#lvl');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 250) : ms));
  const scrollDown = () => requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });

  function add(el) { chat.appendChild(el); scrollDown(); return el; }
  function bubble(cls, html) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.innerHTML = html;
    return add(d);
  }
  async function bot(text) {
    statusEl.textContent = 'пише…';
    const t = bubble('bot', '<div class="typing"><i></i><i></i><i></i></div>');
    t.style.padding = '0';
    await wait(Math.min(450 + text.length * 22, 1700));
    t.style.padding = '';
    t.innerHTML = text;
    statusEl.textContent = 'онлайн';
    scrollDown();
    await wait(260);
  }
  async function says(...lines) { for (const l of lines) await bot(l); }
  function me(text) { bubble('me', text); }
  function sys(text) { const d = document.createElement('div'); d.className = 'sys'; d.textContent = text; add(d); }
  function widget(html) { const w = bubble('wide', html); return w; }
  function setLvl(n) { lvlEl.textContent = `лвл ${n}/4`; }

  function choose(options, note) {
    return new Promise(res => {
      reply.innerHTML = note ? `<span class="note">${note}</span>` : '';
      options.forEach((o, i) => {
        const b = document.createElement('button');
        b.textContent = o;
        b.style.animationDelay = (i * 0.07) + 's';
        b.onclick = () => { reply.innerHTML = ''; me(o); res(i); };
        reply.appendChild(b);
      });
    });
  }
  function hintBar(text) { reply.innerHTML = `<span class="note">${text}</span>`; }
  const clearBar = () => { reply.innerHTML = ''; };

  // ---------- LVL 1: fingerprint + broken meter ----------
  function fingerprint() {
    return new Promise(res => {
      const w = widget(`
        <div class="card">
          <h3>верифікація</h3>
          <div class="finger" id="fp">
            <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" stroke="#262633"/><circle id="ringc" cx="60" cy="60" r="56" stroke="url(#g)" stroke-dasharray="352" stroke-dashoffset="352"/>
              <defs><linearGradient id="g"><stop offset="0" stop-color="#d4ff3a"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient></defs></svg>
            <svg class="print" viewBox="0 0 64 64">
              <path d="M18 22a16 16 0 0 1 28 0"/><path d="M14 32a18 18 0 0 1 36 0v4"/>
              <path d="M20 46c2-4 2-8 2-12a10 10 0 0 1 20 0c0 6-1 12-4 18"/><path d="M27 52c2-5 3-11 3-18a2 2 0 0 1 4 0c0 7-1 13-3 19"/>
              <path d="M44 48c1-3 2-7 2-12"/><path d="M13 42c1-2 1-4 1-6"/>
            </svg>
          </div>
          <div class="scanline" id="sl">затисни й тримай</div>
          <div class="lines" id="ln"></div>
          <div class="meter" id="mt" hidden>
            <div class="top"><span>рівень краси</span><span class="num" id="mn">0%</span></div>
            <div class="bar"><i id="mb"></i></div>
          </div>
        </div>`);
      const fp = w.querySelector('#fp'), ring = w.querySelector('#ringc'), sl = w.querySelector('#sl');
      let t0 = 0, raf = 0, done = false;
      const HOLD = 1600;
      const tick = now => {
        const p = Math.min((now - t0) / HOLD, 1);
        ring.style.strokeDashoffset = 352 * (1 - p);
        sl.textContent = 'сканую… ' + Math.round(p * 100) + '%';
        if (p >= 1) { done = true; fp.classList.add('on'); navigator.vibrate?.(60); after(); return; }
        raf = requestAnimationFrame(tick);
      };
      const down = e => { if (done) return; e.preventDefault(); fp.setPointerCapture?.(e.pointerId); fp.classList.add('on'); t0 = performance.now(); raf = requestAnimationFrame(tick); };
      const up = () => { if (done) return; cancelAnimationFrame(raf); fp.classList.remove('on'); ring.style.strokeDashoffset = 352; sl.textContent = 'ніт, ніт — тримай довше 👆'; };
      fp.addEventListener('pointerdown', down);
      fp.addEventListener('pointerup', up);
      fp.addEventListener('pointercancel', up);
      fp.addEventListener('contextmenu', e => e.preventDefault());

      async function after() {
        sl.textContent = 'відбиток прийнято ✓';
        const ln = w.querySelector('#ln');
        for (const t of ['аналіз очей… космос ✓', 'аналіз усмішки… 10/10 ✓', 'аналіз вайбу… імба ✓']) {
          await wait(550);
          const d = document.createElement('div'); d.className = 'ok'; d.textContent = t; ln.appendChild(d); scrollDown();
        }
        await wait(500);
        const mt = w.querySelector('#mt'), mn = w.querySelector('#mn'), mb = w.querySelector('#mb');
        mt.hidden = false; scrollDown();
        const start = performance.now(), D = reduced ? 400 : 2600;
        await new Promise(r => {
          const step = now => {
            const p = Math.min((now - start) / D, 1);
            const v = p < .45 ? p / .45 * 100 : 100 + Math.pow((p - .45) / .55, 2) * 9899;
            mn.textContent = Math.round(v) + '%';
            mb.style.width = Math.min(v, 100) + '%';
            if (v > 100 && !mt.classList.contains('boom')) { mt.classList.add('boom'); }
            if (v > 100) mb.style.width = (100 + Math.min((v - 100) / 40, 60)) + '%';
            p < 1 ? requestAnimationFrame(step) : r();
          };
          requestAnimationFrame(step);
        });
        mn.textContent = 'ERROR 💥';
        w.querySelector('.card').classList.add('glitch');
        navigator.vibrate?.([40, 40, 80]);
        const r = mt.getBoundingClientRect();
        burst(r.right - 30, r.top, ['💥', '🔥', '✨'], 18);
        await wait(900);
        res();
      }
    });
  }

  // ---------- LVL 2: catch compliments ----------
  function catchGame() {
    return new Promise(res => {
      const g = document.createElement('div');
      g.className = 'game';
      g.innerHTML = `<div class="hud"><div><b id="gc">0</b><b style="color:var(--muted)">/${NEED}</b></div><span>лови компліменти · 🚩 не тицяй</span><div class="gbar"><i id="gb"></i></div></div>`;
      document.body.appendChild(g);
      const gc = g.querySelector('#gc'), gb = g.querySelector('#gb');
      const items = [];
      const caught = [];
      let got = 0, last = 0, spawnEvery = 720, over = false, pool = [...COMPLIMENTS].sort(() => Math.random() - .5), pi = 0;
      function spawn() {
        const flag = Math.random() < 0.24;
        const text = flag ? FLAGS[(Math.random() * FLAGS.length) | 0] : pool[pi++ % pool.length];
        const b = document.createElement('div');
        b.className = 'bub' + (flag ? ' flag' : '');
        b.textContent = text;
        g.appendChild(b);
        const bw = b.offsetWidth;
        const W = innerWidth;
        const it = {
          el: b, flag, text,
          x: 12 + Math.random() * Math.max(10, W - bw - 24),
          y: -60, vy: (reduced ? 1.2 : 1.6) + Math.random() * 1.6 + got * 0.06,
          wob: Math.random() * 6.28, dead: false,
        };
        b.addEventListener('pointerdown', e => { e.stopPropagation(); hit(it, e.clientX, e.clientY); });
        items.push(it);
      }
      function hit(it, x, y) {
        if (it.dead || over) return;
        it.dead = true;
        it.el.classList.add('pop');
        setTimeout(() => it.el.remove(), 260);
        if (it.flag) {
          got = Math.max(0, got - 1);
          g.classList.remove('hurt'); void g.offsetWidth; g.classList.add('hurt');
          const t = document.createElement('div'); t.className = 'toast'; t.textContent = 'кринж! −1'; g.appendChild(t);
          setTimeout(() => t.remove(), 900);
          navigator.vibrate?.(120);
          caught.pop();
        } else {
          got++;
          caught.push(it.text);
          burst(x, y, ['💖', '✨', '💅', '🔥'], 7);
          navigator.vibrate?.(15);
        }
        gc.textContent = got;
        gb.style.width = (got / NEED * 100) + '%';
        if (got >= NEED) finish();
      }
      function finish() {
        over = true;
        burst(innerWidth / 2, innerHeight / 2, ['💖', '✨', '🔥', '👑'], 30);
        setTimeout(() => {
          g.style.transition = 'opacity .4s'; g.style.opacity = 0;
          setTimeout(() => { g.remove(); res(caught); }, 400);
        }, 700);
      }
      function frame(now) {
        if (over && !items.some(i => !i.dead)) return;
        if (!over && now - last > spawnEvery) { last = now; spawn(); spawnEvery = Math.max(480, 720 - got * 18); }
        const H = innerHeight;
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          if (it.dead) { items.splice(i, 1); continue; }
          it.y += it.vy; it.wob += 0.04;
          it.el.style.transform = `translate(${it.x + Math.sin(it.wob) * 10}px, ${it.y}px)`;
          if (it.y > H + 40) { it.dead = true; it.el.remove(); items.splice(i, 1); }
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }

  // ---------- LVL 3: true or fake swipe ----------
  function swipeGame() {
    return new Promise(res => {
      const w = widget(`
        <div class="card">
          <h3>правда чи фейк</h3>
          <div class="swipe" id="sw"></div>
          <div class="shint" id="sh">← фейк · правда →</div>
          <div class="sbtns"><button id="bn" aria-label="Фейк">✕</button><button id="by" aria-label="Правда">💖</button></div>
        </div>`);
      const sw = w.querySelector('#sw'), sh = w.querySelector('#sh');
      let i = 0, cur = null, busy = false;
      function make(k, next) {
        const c = document.createElement('div');
        c.className = 'scard' + (next ? ' next' : '');
        c.innerHTML = `<small>${k + 1} / ${STATEMENTS.length}</small><span class="stamp no">ФЕЙК</span><span class="stamp yes">ПРАВДА</span><div>${STATEMENTS[k][0]}</div>`;
        return c;
      }
      function render() {
        sw.innerHTML = '';
        if (i + 1 < STATEMENTS.length) sw.appendChild(make(i + 1, true));
        cur = make(i, false);
        sw.appendChild(cur);
        bindDrag(cur);
      }
      function setTilt(c, dx) {
        c.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`;
        c.querySelector('.yes').style.opacity = Math.max(0, Math.min(1, dx / 80));
        c.querySelector('.no').style.opacity = Math.max(0, Math.min(1, -dx / 80));
      }
      function answer(sayTrue) {
        if (busy) return;
        const right = STATEMENTS[i][1] === sayTrue;
        const c = cur;
        if (!right) {
          busy = true;
          sh.className = 'shint no';
          sh.textContent = STATEMENTS[i][1] ? 'ніт-ніт, то чиста правда. ще раз 🙂' : 'ага, зараз 🙄 то фейк. ще раз';
          c.style.transition = 'transform .35s cubic-bezier(.3,1.6,.5,1)';
          setTilt(c, sayTrue ? 40 : -40);
          setTimeout(() => { setTilt(c, 0); }, 180);
          setTimeout(() => { c.style.transition = ''; busy = false; }, 550);
          navigator.vibrate?.(80);
          return;
        }
        busy = true;
        sh.className = 'shint ok';
        sh.textContent = sayTrue ? 'айно, правда ✓' : 'фейк, ясно ✓';
        c.style.transition = 'transform .4s ease, opacity .4s';
        setTilt(c, sayTrue ? 520 : -520);
        c.style.opacity = 0;
        const r = sw.getBoundingClientRect();
        if (sayTrue) burst(r.right - 30, r.top + r.height / 2, ['💖', '✨'], 6);
        else burst(r.left + 30, r.top + r.height / 2, ['🗑️', '💨'], 5);
        setTimeout(() => {
          i++;
          busy = false;
          if (i >= STATEMENTS.length) {
            sw.innerHTML = '<div class="scard" style="cursor:default;background:var(--lime)">7 з 7 ✓<br>ти ся сама знаєш 🫶</div>';
            w.querySelector('.sbtns').remove(); sh.remove();
            setTimeout(res, 700);
          } else render();
        }, 380);
      }
      function bindDrag(c) {
        let x0 = 0, dx = 0, drag = false;
        c.addEventListener('pointerdown', e => { if (busy) return; drag = true; x0 = e.clientX; dx = 0; c.setPointerCapture(e.pointerId); c.style.transition = 'none'; });
        c.addEventListener('pointermove', e => { if (!drag) return; dx = e.clientX - x0; setTilt(c, dx); });
        const end = () => {
          if (!drag) return; drag = false;
          if (Math.abs(dx) > 80) answer(dx > 0);
          else { c.style.transition = 'transform .25s ease'; setTilt(c, 0); }
        };
        c.addEventListener('pointerup', end);
        c.addEventListener('pointercancel', end);
      }
      w.querySelector('#by').onclick = () => answer(true);
      w.querySelector('#bn').onclick = () => answer(false);
      render();
    });
  }

  // ---------- LVL 4: scratch card ----------
  function scratch() {
    return new Promise(res => {
      const w = widget(`<div class="card"><h3>зітри пальцем</h3><div class="scratch"><div class="under">${SCRATCH_TEXT}</div><canvas></canvas></div></div>`);
      const cv = w.querySelector('canvas'), box = w.querySelector('.scratch');
      const r = box.getBoundingClientRect();
      const DPR = Math.min(devicePixelRatio || 1, 2);
      cv.width = r.width * DPR; cv.height = r.height * DPR;
      const g = cv.getContext('2d');
      g.scale(DPR, DPR);
      const grd = g.createLinearGradient(0, 0, r.width, r.height);
      grd.addColorStop(0, '#c9c6d6'); grd.addColorStop(.5, '#f1effa'); grd.addColorStop(1, '#a9a5bb');
      g.fillStyle = grd; g.fillRect(0, 0, r.width, r.height);
      g.fillStyle = 'rgba(40,36,60,.5)';
      g.font = '800 15px Unbounded, sans-serif';
      g.textAlign = 'center';
      for (let y = 30; y < r.height; y += 44)
        for (let x = (y / 44 % 2) * 60 + 20; x < r.width; x += 120) g.fillText('✦ зітри ✦', x, y);
      g.globalCompositeOperation = 'destination-out';
      g.lineCap = g.lineJoin = 'round';
      g.lineWidth = 46;
      let drawing = false, px = 0, py = 0, done = false, n = 0;
      const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
      cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); [px, py] = pos(e); g.beginPath(); g.arc(px, py, 23, 0, 7); g.fill(); });
      cv.addEventListener('pointermove', e => {
        if (!drawing || done) return;
        const [x, y] = pos(e);
        g.beginPath(); g.moveTo(px, py); g.lineTo(x, y); g.stroke();
        px = x; py = y;
        if (++n % 12 === 0) check();
      });
      const stop = () => { drawing = false; check(); };
      cv.addEventListener('pointerup', stop);
      cv.addEventListener('pointercancel', stop);
      function check() {
        if (done) return;
        const d = g.getImageData(0, 0, cv.width, cv.height).data;
        let clear = 0, tot = 0;
        for (let k = 3; k < d.length; k += 4 * 37) { tot++; if (d[k] < 40) clear++; }
        if (clear / tot > 0.5) {
          done = true;
          cv.style.opacity = 0;
          const b = box.getBoundingClientRect();
          burst(b.left + b.width / 2, b.top + b.height / 2, ['👑', '✨', '💖', '🔥'], 26);
          navigator.vibrate?.([30, 30, 30]);
          setTimeout(res, 900);
        }
      }
    });
  }

  function certificate() {
    const d = new Date();
    const date = d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' });
    widget(`
      <div class="cert"><div>
        <div class="t">ОФІЦІЙНИЙ СЕРТИФІКАТ</div>
        <div class="name">${NAME}</div>
        <p>Підтверджено: краса — неймовірна.<br>Рівень — імба. Конкурентів — нуль.</p>
        <dl>
          <dt>видано</dt><dd>сервером краси (який ти зламала)</dd>
          <dt>дата</dt><dd>${date}</dd>
          <dt>дійсний</dt><dd>фурт</dd>
        </dl>
        <div class="seal">✓ ВЕРИФІКОВАНО</div>
      </div></div>`);
    const r = chat.getBoundingClientRect();
    let t = 0;
    const fire = setInterval(() => {
      burst(r.left + Math.random() * r.width, r.bottom - 40, ['✨', '💖', '👑', '🔥', '⭐'], 5, true);
      if (++t > (reduced ? 2 : 16)) clearInterval(fire);
    }, 130);
  }

  // ---------- Script ----------
  async function run() {
    chat.innerHTML = ''; setLvl(0);
    await wait(600);
    await says('йой, привіт 👀', 'ти не знаєш, хто я. айбо я знаю, яка ти', 'а ти — барз файна. то так, для протоколу');
    await says('маю для тя квест. 4 лвли. в кінці — нагорода 🏆');
    const a = await choose(['хто ти?? 💀', 'погнали']);
    if (a === 0) await says('скажу в кінці. може 🤫');

    // LVL 1
    setLvl(1); sys('лвл 1 · верифікація');
    await says('мушу провірити, ци ти — то ти', 'приклади пальчик і тримай 👇');
    hintBar('тримай палець на відбитку');
    await fingerprint();
    clearBar();
    await says('йой. сервак ся впав 💀', 'шкала краси лем до 100%. ти її гет зламала', 'верифікацію пройдено. така файна лем одна — то точно ти');
    await choose(['😳', 'ну я знаю 💅']);

    // LVL 2
    setLvl(2); sys('лвл 2 · лови компліменти');
    await says(`зверху полетят компліменти. тицяй по них, лови ${NEED} штук`, 'кедь видиш 🚩 — не чіпай. то кринж, мінус бал');
    await choose(['я готова 🔥']);
    const caught = await catchGame();
    await says('ади, што ти назбирала:');
    widget(`<div class="msg bot" style="max-width:100%;animation:none"><div class="chips">${caught.map(c => `<span>${c}</span>`).join('')}</div></div>`);
    await wait(500);
    await says('і то лем ті, што впіймала. решта ще в дорозі 🚚');

    // LVL 3
    setLvl(3); sys('лвл 3 · правда чи фейк');
    await says('свайпай. вправо — правда, вліво — фейк', 'кнопки внизу теж робят, кедь лінь свайпати 😌');
    await swipeGame();
    await says('бачиш, ти й сама знаєш, яка ти 🫶');

    // LVL 4
    setLvl(4); sys('лвл 4 · фінал');
    await says('остання. там є напис, айбо його закрили', 'зітри пальцем — ади, што під низом 🪙');
    hintBar('три пальцем по сірому');
    await scratch();
    clearBar();
    await says('то не я придумав. то факт 🤷');

    sys('квест пройдено ✓');
    await says('тримай нагороду 🏆');
    certificate();
    await wait(1400);
    await says(`${NAME}, ти неймовірна. не лем файна — а така, што аж сервери падают`, 'хай ся ніхто не переконує в іншому. особливо 🚩', 'а хто я — ти вже, певно, здогадалася 😉');
    await says(SIGNATURE);
    const z = await choose(['🥹🖤', 'пройти ще раз']);
    if (z === 1) run();
    else hintBar('можеш зробити скрін сертифіката 📸');
  }

  // ---------- FX canvas ----------
  const fx = $('#fx'), ctx = fx.getContext('2d');
  let W, H, DPR;
  const sprites = new Map(), bits = [];
  function sprite(ch) {
    let s = sprites.get(ch);
    if (s) return s;
    s = document.createElement('canvas');
    s.width = s.height = 64 * DPR;
    const g = s.getContext('2d');
    g.font = `${51 * DPR}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, s.width / 2, s.height / 2 + 3 * DPR);
    sprites.set(ch, s);
    return s;
  }
  function burst(x, y, set, n = 8, up = false) {
    if (reduced) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) {
      if (bits.length > 200) bits.shift();
      const ch = set[(Math.random() * set.length) | 0];
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      bits.push({
        ch, img: sprite(ch), x, y,
        vx: up ? (Math.random() - .5) * 4 : Math.cos(a) * sp,
        vy: up ? -(5 + Math.random() * 7) : Math.sin(a) * sp - 3,
        g: up ? .12 : .28, rot: (Math.random() - .5) * .6, vr: (Math.random() - .5) * .15,
        size: 18 + Math.random() * 18, life: 80,
      });
    }
  }
  let dirty = false;
  function loop() {
    if (bits.length || dirty) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, fx.width, fx.height);
      dirty = bits.length > 0;
    }
    let alive = 0;
    for (const b of bits) {
      if (--b.life <= 0) continue;
      bits[alive++] = b;
      b.vy += b.g; b.vx *= .98; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      const c = Math.cos(b.rot) * DPR, sn = Math.sin(b.rot) * DPR, r = b.size / 2;
      ctx.setTransform(c, sn, -sn, c, b.x * DPR, b.y * DPR);
      ctx.globalAlpha = b.life < 25 ? b.life / 25 : 1;
      ctx.drawImage(b.img, -r, -r, b.size, b.size);
    }
    bits.length = alive;
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    fx.width = W * DPR; fx.height = H * DPR;
    sprites.clear();
    for (const b of bits) b.img = sprite(b.ch);
  }
  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(loop);
  run();
})();
</script>
